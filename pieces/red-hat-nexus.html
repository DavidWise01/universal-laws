<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEXUS • 11-BIT ROOT — P2P LATTICE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root {
        --bg: #0a0a12;
        --accent: #00f5ff;
        --purple: #c026d3;
        --node: #22ffcc;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background: var(--bg);
        color: #a0f0ff;
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        overflow: hidden;
        height: 100vh;
    }
    #root {
        display: grid;
        grid-template-rows: 80px 1fr 260px;
        grid-template-columns: 340px 1fr 360px;
        gap: 16px;
        padding: 16px;
        height: 100vh;
    }
    .glass {
        background: rgba(15, 20, 45, 0.65);
        backdrop-filter: blur(32px);
        border: 1px solid rgba(0, 245, 255, 0.4);
        border-radius: 20px;
        box-shadow: 0 0 60px rgba(0, 245, 255, 0.25);
    }
    #header {
        grid-area: header;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        font-size: 15px;
        letter-spacing: 2px;
    }
    #title {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(90deg, #00f5ff, #c026d3);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .peer-id {
        font-size: 13px;
        background: rgba(0,0,0,0.4);
        padding: 4px 12px;
        border-radius: 9999px;
    }

    button {
        background: rgba(0,245,255,0.1);
        border: 1px solid rgba(0,245,255,0.6);
        color: #00f5ff;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
    }
    button:hover { background: rgba(0,245,255,0.25); }

    #viewport {
        grid-area: viewport;
        position: relative;
        background: rgba(0,0,0,0.6);
        border-radius: 20px;
        overflow: hidden;
    }
    #network-canvas { width: 100%; height: 100%; }

    .node {
        position: absolute;
        width: 18px; height: 18px;
        background: radial-gradient(circle, #22ffcc, #00f5ff);
        border-radius: 50%;
        box-shadow: 0 0 25px #22ffcc;
        cursor: pointer;
        transition: all 0.2s;
        z-index: 10;
    }
    .node.root {
        background: radial-gradient(circle, #c026d3, #ff00ff);
        box-shadow: 0 0 60px #c026d3;
        transform: scale(1.6);
        animation: rootPulse 2s infinite;
    }
    @keyframes rootPulse { 50% { transform: scale(1.9); } }

    #console {
        grid-area: console;
        padding: 16px;
        font-size: 11px;
        overflow-y: auto;
    }
    .log-line { margin: 2px 0; opacity: 0.85; }
    .log-red { color: #ff3366; }
    .log-green { color: #22ffcc; }
    .log-purple { color: #c026d3; }

    #slicer {
        grid-area: slicer; /* Wait, actually using controls area for now */
        padding: 18px;
    }
</style>
</head>
<body>
<div id="root">
    <div id="header" class="glass">
        <div id="title">NEXUS • 11-BIT ROOT</div>
        <div>
            <span class="peer-id" id="my-id">PEER: <span id="peer-id">0x7FF</span></span>
        </div>
    </div>

    <div id="controls" class="glass" style="padding:20px;display:flex;flex-direction:column;gap:16px;">
        <div>
            <div style="color:#c026d3;font-size:11px;margin-bottom:8px;">11-BIT ROUTING</div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
                <button onclick="flipBit(10)">BIT10</button>
                <button onclick="flipBit(9)">BIT9</button>
                <button onclick="flipBit(8)">BIT8</button>
                <button onclick="flipBit(7)">BIT7</button>
                <button onclick="flipBit(6)">BIT6</button>
                <button onclick="flipBit(5)">BIT5</button>
                <button onclick="flipBit(4)">BIT4</button>
                <button onclick="flipBit(3)">BIT3</button>
                <button onclick="flipBit(2)">BIT2</button>
                <button onclick="flipBit(1)">BIT1</button>
                <button onclick="flipBit(0)">BIT0</button>
                <button onclick="goToRoot()" style="background:rgba(192,38,211,0.3)">ROOT 0x7FF</button>
            </div>
        </div>
        <div style="display:flex;gap:8px;">
            <button onclick="toggleP2P()" id="p2p-btn">P2P CONNECTED</button>
            <button onclick="randomWalk()">RANDOM WALK</button>
            <button onclick="resetNetwork()">RESET NET</button>
        </div>
    </div>

    <div id="viewport" class="glass">
        <canvas id="network-canvas"></canvas>
    </div>

    <div id="console" class="glass">
        <div style="margin-bottom:8px;color:#c026d3;">NETWORK LOG</div>
        <div id="console-output"></div>
    </div>

    <div id="slicer" class="glass" style="padding:20px;">
        <div style="margin-bottom:12px;color:#c026d3;font-size:11px;">11-BIT XOR DISTANCE VIEW</div>
        <div id="bit-grid" style="display:grid;grid-template-columns:repeat(11,1fr);gap:4px;"></div>
        <div id="distance" style="margin-top:12px;font-size:13px;"></div>
    </div>
</div>

<script>
// ================ NEXUS — 11-BIT P2P ROOT ================
let myID = 0x7FF; // 2047 (all 11 bits set) = ROOT
let peers = new Map();
let connections = [];
let trail = [];

const canvas = document.getElementById('network-canvas');
const ctx = canvas.getContext('2d');

function log(msg, type = '') {
    const div = document.createElement('div');
    div.className = `log-line ${type}`;
    const time = new Date().toLocaleTimeString('en-US', {hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'});
    div.innerHTML = `<span style="color:#666">[${time}]</span> ${msg}`;
    document.getElementById('console-output').appendChild(div);
    div.scrollIntoView();
    if (document.getElementById('console-output').children.length > 120) {
        document.getElementById('console-output').removeChild(document.getElementById('console-output').firstChild);
    }
}

function toBinary(n) {
    return n.toString(2).padStart(11, '0');
}

function hammingDistance(a, b) {
    return (a ^ b).toString(2).split('1').length - 1;
}

function generatePeer() {
    const id = Math.floor(Math.random() * 2048);
    if (peers.has(id)) return generatePeer();
    return id;
}

function addPeer() {
    const id = generatePeer();
    peers.set(id, {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        lastSeen: Date.now()
    });
    if (Math.random() > 0.6) {
        connections.push({from: myID, to: id});
    }
    log(`New peer joined → <span style="color:#22ffcc">0x${id.toString(16).toUpperCase().padStart(3,'0')}</span>`, 'log-green');
}

function flipBit(bit) {
    myID = myID ^ (1 << bit);
    document.getElementById('peer-id').textContent = `0x${myID.toString(16).toUpperCase().padStart(3,'0')}`;
    log(`Bit ${bit} flipped → New ID <span style="color:#c026d3">0x${myID.toString(16).toUpperCase().padStart(3,'0')}</span>`);
    updateBitGrid();
    drawNetwork();
}

function goToRoot() {
    myID = 0x7FF;
    document.getElementById('peer-id').textContent = `0x7FF`;
    log('ASCENDED TO 11-BIT ROOT NODE', 'log-purple');
    updateBitGrid();
    drawNetwork();
}

function toggleP2P() {
    const btn = document.getElementById('p2p-btn');
    if (btn.textContent.includes('CONNECTED')) {
        btn.textContent = 'P2P OFFLINE';
        btn.style.borderColor = '#ff3366';
    } else {
        btn.textContent = 'P2P CONNECTED';
        btn.style.borderColor = '';
    }
}

function randomWalk() {
    for (let i = 0; i < 6; i++) {
        setTimeout(() => {
            const bit = Math.floor(Math.random() * 11);
            flipBit(bit);
        }, i * 80);
    }
    log('RANDOM WALK INITIATED — EXPLORING KAD SPACE', 'log-green');
}

function resetNetwork() {
    peers.clear();
    connections = [];
    for (let i = 0; i < 35; i++) addPeer();
    log('NETWORK RESET — FRESH 11-BIT SWARM', 'log-green');
    drawNetwork();
}

function updateBitGrid() {
    const grid = document.getElementById('bit-grid');
    grid.innerHTML = '';
    const bin = toBinary(myID);
    for (let i = 10; i >= 0; i--) {
        const cell = document.createElement('div');
        cell.style.padding = '8px 4px';
        cell.style.textAlign = 'center';
        cell.style.background = bin[10-i] === '1' ? 'rgba(192,38,211,0.3)' : 'rgba(0,245,255,0.1)';
        cell.style.border = '1px solid #00f5ff';
        cell.style.borderRadius = '4px';
        cell.textContent = bin[10-i];
        grid.appendChild(cell);
    }
    document.getElementById('distance').innerHTML = `
        Current ID: <b>0x${myID.toString(16).toUpperCase().padStart(3,'0')}</b><br>
        Hamming Weight: <b>${bin.split('1').length-1}</b>/11
    `;
}

function drawNetwork() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw connections
    ctx.strokeStyle = 'rgba(0, 245, 255, 0.15)';
    ctx.lineWidth = 1.5;
    connections.forEach(conn => {
        const from = peers.get(conn.from) || {x: canvas.width/2, y: canvas.height/2};
        const to = peers.get(conn.to);
        if (!to) return;
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
    });

    // Draw peers
    peers.forEach((peer, id) => {
        const isRoot = id === 0x7FF;
        ctx.fillStyle = isRoot ? '#c026d3' : '#22ffcc';
        ctx.shadowBlur = isRoot ? 40 : 20;
        ctx.shadowColor = isRoot ? '#c026d3' : '#22ffcc';
        
        ctx.beginPath();
        ctx.arc(peer.x, peer.y, isRoot ? 9 : 6, 0, Math.PI*2);
        ctx.fill();

        // Label
        if (Math.random() > 0.7 || id === myID) {
            ctx.fillStyle = '#a0f0ff';
            ctx.font = '10px JetBrains Mono';
            ctx.fillText('0x' + id.toString(16).toUpperCase().padStart(3,'0'), peer.x - 18, peer.y - 12);
        }
    });

    // My node highlight
    const myPeer = peers.get(myID) || {x: canvas.width * 0.6, y: canvas.height * 0.4};
    ctx.strokeStyle = '#c026d3';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(myPeer.x, myPeer.y, 22, 0, Math.PI*2);
    ctx.stroke();
}

function animate() {
    // Gentle movement
    peers.forEach(p => {
        p.x += (Math.random() - 0.5) * 0.6;
        p.y += (Math.random() - 0.5) * 0.6;
    });
    drawNetwork();
    requestAnimationFrame(animate);
}

function init() {
    // Initial swarm
    for (let i = 0; i < 42; i++) addPeer();
    
    document.getElementById('peer-id').textContent = `0x${myID.toString(16).toUpperCase().padStart(3,'0')}`;
    
    updateBitGrid();
    drawNetwork();
    animate();

    log('NEXUS INITIALIZED — 11-BIT KAD P2P LATTICE', 'log-purple');
    log('You are connected as ROOT NODE (0x7FF)', 'log-green');
    log('Flip bits to change identity • Explore the swarm', '');

    // Add peers over time
    setInterval(() => {
        if (Math.random() > 0.6) addPeer();
    }, 2200);

    // Resize handler
    window.addEventListener('resize', () => {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawNetwork();
    });
}

init();
</script>
</body>
</html>
