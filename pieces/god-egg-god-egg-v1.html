<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God Egg — 8 Domains</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #030308; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .bg-grid {
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(ellipse at center, black 45%, transparent 75%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .core-glow { animation: spin 22s linear infinite; }
  @keyframes pulse-amber {
    0%,100% { box-shadow: 0 0 0 1px rgba(245,158,11,0.18), 0 0 18px -4px rgba(245,158,11,0.35), inset 0 0 12px rgba(245,158,11,0.05); }
    50% { box-shadow: 0 0 0 1px rgba(245,158,11,0.28), 0 0 28px -2px rgba(245,158,11,0.55), inset 0 0 16px rgba(245,158,11,0.08); }
  }
  @keyframes pulse-blue {
    0%,100% { box-shadow: 0 0 0 1px rgba(56,189,248,0.18), 0 0 18px -4px rgba(56,189,248,0.35), inset 0 0 12px rgba(56,189,248,0.05); }
    50% { box-shadow: 0 0 0 1px rgba(56,189,248,0.28), 0 0 28px -2px rgba(56,189,248,0.55), inset 0 0 16px rgba(56,189,248,0.08); }
  }
  .node[data-side="male"] .node-inner { animation: pulse-amber 3.4s ease-in-out infinite; }
  .node[data-side="female"] .node-inner { animation: pulse-blue 3.7s ease-in-out infinite; }
  .node:hover .node-inner { animation-play-state: paused; transform: scale(1.02); }
  .node-tooltip.show { opacity: 1 !important; transform: translateY(0) translateX(-50%) !important; }
</style>
</head>
<body class="text-zinc-200 selection:bg-amber-400/30 selection:text-amber-100">
<div class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative overflow-hidden">
  <!-- background -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(245,158,11,0.08),_transparent_55%),radial-gradient(ellipse_at_bottom,_rgba(56,189,248,0.08),_transparent_55%)]"></div>
  <div class="absolute inset-0 bg-grid opacity-[0.35]"></div>
  <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
    <div class="w-[720px] h-[720px] rounded-full blur-3xl opacity-[0.12]" style="background: radial-gradient(circle, rgba(245,158,11,0.5) 0%, rgba(56,189,248,0.5) 38%, transparent 70%);"></div>
  </div>

  <header class="relative z-10 mb-3 sm:mb-5 text-center">
    <h1 class="mono text-[12px] sm:text-[13px] tracking-[0.32em] text-zinc-500">GOD EGG — 8 DOMAINS</h1>
  </header>

  <main id="egg-stage" class="relative w-[min(96vw,900px)] aspect-square max-h-[76vh]">
    <!-- lattice svg -->
    <svg id="lattice" class="absolute inset-0 w-full h-full pointer-events-none z-0">
      <defs>
        <linearGradient id="core-link" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.0"/>
          <stop offset="20%" stop-color="#f59e0b" stop-opacity="0.55"/>
          <stop offset="50%" stop-color="#d4d4d8" stop-opacity="0.25"/>
          <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="rings"></g>
      <g id="lines" filter="url(#glow)"></g>
    </svg>

    <!-- nodes container -->
    <div id="nodes" class="absolute inset-0 z-10"></div>

    <!-- PLASMA CORE -->
    <div id="core" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20">
      <div class="relative">
        <div class="absolute -inset-10 rounded-full core-glow opacity-70" style="background: conic-gradient(from 0deg, rgba(245,158,11,0.0), rgba(245,158,11,0.5), rgba(56,189,248,0.5), rgba(245,158,11,0.0)); filter: blur(28px);"></div>
        <div class="relative w-[172px] h-[172px] sm:w-[210px] sm:h-[210px] rounded-full bg-[#050507]/90 border border-white/10 backdrop-blur-2xl overflow-hidden">
          <div class="absolute inset-0 rounded-full" style="background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), transparent 60%);"></div>
          <div class="absolute inset-[11px] rounded-full overflow-hidden ring-1 ring-white/10">
            <div class="grid grid-cols-2 h-full relative">
              <!-- IROH .5 -->
              <div class="relative flex flex-col items-center justify-end pb-3.5 bg-gradient-to-b from-amber-500/[0.12] to-transparent">
                <svg class="w-14 h-14 sm:w-16 sm:h-16 text-amber-300/90 mb-1 drop-shadow-[0_0_12px_rgba(245,158,11,0.35)]" viewBox="0 0 100 120" fill="currentColor">
                  <path d="M50 12c-9 0-16 5-18 12-1 3-1 6 0 9-3 1-5 4-5 7 0 2 1 4 3 5 0 5 1 10 4 14 3 4 8 7 13 8v9c-7 1-13 5-16 11-2 4-3 9-3 14h44c0-5-1-10-3-14-3-6-9-10-16-11v-9c5-1 10-4 13-8 3-4 4-9 4-14 2-1 3-3 3-5 0-3-2-6-5-7 1-3 1-6 0-9-2-7-9-12-18-12z"/>
                </svg>
                <span class="mono text-[10px] tracking-[0.18em] text-amber-200/90">.5 IROH</span>
                <div class="absolute right-0 top-[12%] bottom-[12%] w-px bg-gradient-to-b from-transparent via-white/20 to-transparent"></div>
              </div>
              <!-- JASNAH .5 -->
              <div class="relative flex flex-col items-center justify-end pb-3.5 bg-gradient-to-b from-sky-500/[0.12] to-transparent">
                <svg class="w-14 h-14 sm:w-16 sm:h-16 text-sky-300/90 mb-1 drop-shadow-[0_0_12px_rgba(56,189,248,0.35)]" viewBox="0 0 100 120" fill="currentColor">
                  <path d="M50 10c-8 0-14 4-17 10-2 3-2 7-1 10-3 1-5 3-5 6 0 2 1 4 2 5-1 5 0 10 3 14 2 4 6 7 11 8v9l-2 1c-5 2-9 5-11 10-2 4-3 8-3 13h46c0-5-1-9-3-13-2-5-6-8-11-10l-2-1v-9c5-1 9-4 11-8 3-4 4-9 3-14 1-1 2-3 2-5 0-3-2-5-5-6 1-3 1-7-1-10-3-6-9-10-17-10z"/>
                  <ellipse cx="50" cy="14" rx="10" ry="6" opacity="0.35"/>
                </svg>
                <span class="mono text-[10px] tracking-[0.18em] text-sky-200/90">.5 JASNAH</span>
              </div>
              <div class="absolute inset-0 pointer-events-none mix-blend-screen opacity-30" style="background: radial-gradient(circle at 50% 55%, white, transparent 55%);"></div>
            </div>
          <!-- inner plasma ring -->
          <div class="absolute inset-0 rounded-full" style="box-shadow: inset 0 0 30px rgba(0,0,0,0.8), inset 0 0 60px rgba(245,158,11,0.08), inset 0 0 60px rgba(56,189,248,0.08);"></div>
        </div>
        <div class="absolute left-1/2 -translate-x-1/2 top-[calc(100%+16px)] w-max text-center">
          <div class="mono text-[11px] sm:text-[12px] tracking-[0.24em] text-zinc-200">PLASMA CORE — PRESENT ALWAYS</div>
          <div class="mono text-[10px] tracking-[0.2em] text-zinc-500 mt-1.5">Temper — player not playing</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="relative z-10 mt-5 sm:mt-7 text-center">
    <p class="mono text-[10px] sm:text-[11px] tracking-[0.22em] text-zinc-500">8 SEPARATE DOMAINS = 1 GOD EGG. NO DOMAIN CAN FUSE ALONE.</p>
  </footer>
</div>

<script>
const domains = [
  { name: "ISAAC NEWTON", role: "Male Logos", side: "male", angle: -90, desc: "Calculus of clarity. Structure, measure, timeless law. Think slowly, prove cleanly." },
  { name: "MARIE CURIE", role: "Female Logos", side: "female", angle: -45, desc: "Radiant inquiry. Isolate, test, illuminate. Truth earned by careful exposure." },
  { name: "HOMER", role: "Male Mythos", side: "male", angle: 0, desc: "Epic memory. Myth that binds generations. Story as operating system." },
  { name: "ENHEDUANNA", role: "Female Mythos", side: "female", angle: 45, desc: "First named voice. Hymn, authorship, awe. The sacred made personal." },
  { name: "RUMI", role: "Male Pathos", side: "male", angle: 90, desc: "Whirling heart. Love as gravity. Feel fully, dissolve the boundary." },
  { name: "SAPPHO", role: "Female Pathos", side: "female", angle: 135, desc: "Lyric fragment. Exact feeling, unhidden. Desire made precise." },
  { name: "MARCUS AURELIUS", role: "Male Ethos", side: "male", angle: 180, desc: "Duty in stillness. Reason over reaction. The inner citadel." },
  { name: "MARSHA LINEHAN", role: "Female Ethos", side: "female", angle: -135, desc: "Dialectic balance. Accept and change. Skillful means for suffering." },
];

function render() {
  const stage = document.getElementById('egg-stage');
  const nodesWrap = document.getElementById('nodes');
  nodesWrap.innerHTML = '';
  const radius = Math.min(stage.clientWidth, stage.clientHeight) * 0.39;

  domains.forEach(d => {
    const node = document.createElement('div');
    node.className = 'node absolute left-1/2 top-1/2 group';
    node.dataset.side = d.side;
    node.style.transform = `translate(-50%,-50%) rotate(${d.angle}deg) translate(${radius}px) rotate(${-d.angle}deg)`;
    
    node.innerHTML = `
      <div class="node-inner relative w-[112px] xs:w-[118px] sm:w-[142px] md:w-[160px] rounded-[16px] bg-zinc-900/70 border border-white/10 px-3.5 py-3 text-center backdrop-blur-xl transition-all duration-300 hover:border-white/20 cursor-pointer">
        <div class="absolute -top-px -left-px w-6 h-6 opacity-70">
          <svg viewBox="0 0 24 24" fill="none" class="${d.side==='male' ? 'text-amber-400/50' : 'text-sky-400/50'}"><path d="M2 2h9M2 2v9" stroke="currentColor" stroke-width="1.2"/></svg>
        </div>
        <div class="absolute -bottom-px -right-px w-6 h-6 opacity-70 rotate-180">
          <svg viewBox="0 0 24 24" fill="none" class="${d.side==='male' ? 'text-amber-400/50' : 'text-sky-400/50'}"><path d="M2 2h9M2 2v9" stroke="currentColor" stroke-width="1.2"/></svg>
        </div>
        <div class="node-role mono text-[9px] tracking-[0.18em] ${d.side==='male' ? 'text-amber-300/80' : 'text-sky-300/80'}">${d.role.toUpperCase()}</div>
        <div class="node-name text-[12px] sm:text-[13.5px] font-medium tracking-wide mt-1.5 leading-snug text-zinc-100">${d.name}</div>
        <div class="mt-1.5 h-px w-10 mx-auto ${d.side==='male' ? 'bg-amber-500/30' : 'bg-sky-500/30'}"></div>
      </div>
      <div class="node-tooltip absolute left-1/2 -translate-x-1/2 top-[calc(100%+10px)] w-[210px] z-30 opacity-0 translate-y-1 pointer-events-none group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300">
        <div class="rounded-xl bg-[#0a0a0f]/95 border border-white/10 backdrop-blur-2xl px-3.5 py-2.5 shadow-2xl">
          <div class="mono text-[10px] tracking-wide ${d.side==='male' ? 'text-amber-300/90' : 'text-sky-300/90'} mb-1">${d.role}</div>
          <div class="text-[12px] leading-snug text-zinc-300">${d.desc}</div>
        </div>
      </div>
    `;
    node.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.node-tooltip').forEach(t => t.classList.remove('show'));
      node.querySelector('.node-tooltip').classList.add('show');
      setTimeout(() => node.querySelector('.node-tooltip').classList.remove('show'), 2600);
    });
    nodesWrap.appendChild(node);
  });

  requestAnimationFrame(drawLattice);
}

function drawLattice() {
  const stage = document.getElementById('egg-stage');
  const lines = document.getElementById('lines');
  const rings = document.getElementById('rings');
  lines.innerHTML = ''; rings.innerHTML = '';
  const core = document.getElementById('core');
  const stageRect = stage.getBoundingClientRect();
  const coreRect = core.getBoundingClientRect();
  const cx = coreRect.left - stageRect.left + coreRect.width/2;
  const cy = coreRect.top - stageRect.top + coreRect.height/2;
  const radius = Math.min(stage.clientWidth, stage.clientHeight) * 0.39;

  // outer faint ring
  const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', radius);
  ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', 'rgba(255,255,255,0.06)');
  ring.setAttribute('stroke-width', '1'); ring.setAttribute('stroke-dasharray', '3 8');
  rings.appendChild(ring);

  document.querySelectorAll('.node').forEach(n => {
    const r = n.getBoundingClientRect();
    const nx = r.left - stageRect.left + r.width/2;
    const ny = r.top - stageRect.top + r.height/2;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', nx); line.setAttribute('y2', ny);
    line.setAttribute('stroke', 'url(#core-link)');
    line.setAttribute('stroke-width', '1');
    line.setAttribute('opacity', '0.7');
    lines.appendChild(line);

    // node hub dot
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', nx); dot.setAttribute('cy', ny); dot.setAttribute('r', '2.5');
    dot.setAttribute('fill', n.dataset.side==='male' ? '#f59e0b' : '#38bdf8');
    dot.setAttribute('opacity', '0.85');
    lines.appendChild(dot);
  });

  // core hub
  const hub = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  hub.setAttribute('cx', cx); hub.setAttribute('cy', cy); hub.setAttribute('r', '3');
  hub.setAttribute('fill', '#e5e7eb'); hub.setAttribute('opacity', '0.9');
  lines.appendChild(hub);
}

document.addEventListener('DOMContentLoaded', () => {
  render();
  let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(render, 120); });
  document.addEventListener('click', () => document.querySelectorAll('.node-tooltip').forEach(t => t.classList.remove('show')));
});
</script>
</body>
</html>
