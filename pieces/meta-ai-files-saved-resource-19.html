<script>
const TREE = {
  root: ['core','insurance','deployer','jane'],
  core: ['core-witness','core-folder','core-records','core-hashes'],
  insurance: ['ins-claim','ins-generate','ins-output','ins-history'],
  deployer: ['dep-input','dep-deploy','dep-progress','dep-checklist'],
  jane: ['jane-grid','jane-detail','jane-pi','jane-log']
};

const TITLES = {
  root: 'AKASHA v0.0',
  core: 'AKASHA CORE',
  insurance: 'INSURANCE WARRIOR',
  deployer: 'PARALLEL DEPLOYER',
  jane: 'JANE TRACKER',
  'core-witness': 'WITNESS',
  'core-folder': 'FOLDER',
  'core-records': 'RECORDS',
  'core-hashes': 'HASHES',
  'ins-claim': 'CLAIM',
  'ins-generate': 'GENERATE',
  'ins-output': 'OUTPUT',
  'ins-history': 'HISTORY',
  'dep-input': 'ACTION',
  'dep-deploy': 'DEPLOY',
  'dep-progress': 'PROGRESS',
  'dep-checklist': '64 CHECK',
  'jane-grid': '64 GRID',
  'jane-detail': 'DETAIL',
  'jane-pi': 'π TIME',
  'jane-log': 'LOG'
};

function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem('akasha-v0'));
    if (s) return s;
  } catch {}
  return {
    akasha: { witnesses: [] },
    insurance: { claim: '300-0073283-2026', history: [] },
    deployer: { action: '', deployments: Array(64).fill(false) },
    jane: { boxes: Array(64).fill(false), timestamps: {}, selected: 0 }
  };
}
let store = loadStore();
if (!store.jane.boxes.some(Boolean)) store.jane.boxes[0] = true;
function save() { localStorage.setItem('akasha-v0', JSON.stringify(store)); }

let currentPath = [];
let piInterval;

async function sha256(file) {
  const buf = await file.arrayBuffer();
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,'0')).join('');
}

window.witnessFolder = async (e) => {
  e.stopPropagation();
  if (!window.showDirectoryPicker) {
    alert('File System Access API requires Chrome/Edge on HTTPS');
    return;
  }
  try {
    const dir = await showDirectoryPicker({mode:'read'});
    let added = 0;
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind === 'file' && added < 50) {
        try {
          const file = await handle.getFile();
          const hash = await sha256(file);
          store.akasha.witnesses.push({ name: file.name, size: file.size, hash, ts: Date.now() });
          added++;
        } catch {}
      }
    }
    store.akasha.witnesses = store.akasha.witnesses.slice(-200);
    save();
    render();
  } catch (err) {}
};

window.generateDemand = (e) => {
  e.stopPropagation();
  const claim = store.insurance.claim;
  const date = new Date().toISOString().slice(0,10);
  const witness = store.akasha.witnesses[0]?.hash?.slice(0,16) || 'PENDING';
  const text = `AKASHA OS v0.0 - INSURANCE WARRIOR\n\nDEMAND FOR PAYMENT\n\nClaim Number: ${claim}\nDate: ${date}\nWitness: ${witness}\n\nPursuant to policy terms, formal demand is made for full payment plus statutory interest. All supporting documents witnessed via AKASHA CORE SHA-256.\n\nPayment due within 10 business days.\n\nπ Timestamp: ${(Date.now()/Math.PI).toFixed(5)}\n\n/s/ Automated Warrior`;
  store.insurance.history.unshift({ ts: Date.now(), claim, text });
  save();
  const ta = document.getElementById('ins-output');
  if (ta) ta.value = text;
  render();
};

window.updateAction = (e) => {
  e.stopPropagation();
  store.deployer.action = e.target.value;
  save();
};

window.deploy64 = (e) => {
  e.stopPropagation();
  if (window._deploying) return;
  window._deploying = true;
  store.deployer.deployments = Array(64).fill(false);
  let i = 0;
  const int = setInterval(() => {
    store.deployer.deployments[i] = true;
    i++;
    document.querySelectorAll('[data-progtxt]').forEach(el => el.textContent = `${i}/64`);
    document.querySelectorAll('[data-prog]').forEach(el => el.style.width = `${(i/64*100)}%`);
    if (i >= 64) {
      clearInterval(int);
      window._deploying = false;
      save();
      setTimeout(render, 200);
    }
  }, 35);
};

window.toggleJane = (e, idx) => {
  e.stopPropagation();
  store.jane.boxes[idx] = !store.jane.boxes[idx];
  store.jane.timestamps[idx] = Date.now() / Math.PI;
  store.jane.selected = idx;
  save();
  render();
};

function getChildren() {
  if (currentPath.length === 0) return [];
  const last = currentPath[currentPath.length-1];
  return TREE[last] || [`${last}-a`,`${last}-b`,`${last}-c`,`${last}-d`];
}

function getTitle(id) {
  return TITLES[id] || id.toUpperCase().replace(/-/g,' ');
}

function getContent(id) {
  switch(id) {
    case 'core': {
      const count = store.akasha.witnesses.length;
      const status = count > 0 ? 'ACTIVE' : 'IDLE';
      const last5 = store.akasha.witnesses.slice(-5).reverse();
      return `<div style="display:flex;justify-content:space-between"><span style="opacity:.6">WITNESS</span><span style="color:#00ffff">${count}</span></div>
      <div style="display:flex;justify-content:space-between;margin:4px 0 10px"><span style="opacity:.6">STATUS</span><span>${status}</span></div>
      <button class="btn-full" onclick="witnessFolder(event)">Witness Folder</button>
      <div style="margin-top:12px;font-size:10px;opacity:.5">LAST 5</div>
      <div>${last5.map(r=>`<div style="display:flex;justify-content:space-between;font-size:10px;padding:2px 0;border-bottom:1px solid #111"><span style="overflow:hidden;text-overflow:ellipsis;max-width:65%">${r.name}</span><span style="color:#00ffff;opacity:.7">${r.hash.slice(0,6)}</span></div>`).join('') || '<div style="opacity:.3;font-size:10px;padding:6px 0">none</div>'}</div>`;
    }
    case 'insurance': {
      return `<div style="margin-bottom:6px"><span style="opacity:.6">CLAIM</span><div style="color:#00ffff;font-size:15px;margin-top:2px">${store.insurance.claim}</div></div>
      <button class="btn-full" onclick="generateDemand(event)">Generate Demand</button>
      <textarea id="ins-output" class="dark" style="height:calc(100% - 78px);margin-top:8px" placeholder="output..."></textarea>`;
    }
    case 'deployer': {
      const prog = store.deployer.deployments.filter(Boolean).length;
      return `<input class="inp-full" placeholder="action..." value="${store.deployer.action}" oninput="updateAction(event)" onclick="event.stopPropagation()">
      <button class="btn-full" onclick="deploy64(event)">Deploy 64</button>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:11px"><span style="opacity:.6">PROGRESS</span><span data-progtxt style="color:#00ffff">${prog}/64</span></div>
      <div class="progress-bar"><div data-prog class="progress-fill" style="width:${prog/64*100}%"></div></div>`;
    }
    case 'jane': {
      const on = store.jane.boxes.filter(Boolean).length;
      return `<div style="display:flex;justify-content:space-between"><span style="opacity:.6">FOUND</span><span style="color:#00ffff">${on}/64</span></div>
      <div class="mini-grid">${store.jane.boxes.map((b,i)=>`<div class="mini-cell ${b?'on':''}" onclick="toggleJane(event,${i})" title="Box ${i+1}"></div>`).join('')}</div>
      <div style="margin-top:6px;font-size:9px;opacity:.4">BOX 1 LIT • CLICK TOGGLE</div>`;
    }
    case 'core-witness':
      return `<div style="text-align:center;padding-top:18%"><div style="font-size:52px;color:#00ffff">${store.akasha.witnesses.length}</div><div style="opacity:.6;letter-spacing:2px;margin-top:4px">WITNESSES</div><div style="margin-top:24px;font-size:11px">STATUS <span style="color:#00ffff">${store.akasha.witnesses.length?'ACTIVE':'IDLE'}</span></div></div>`;
    case 'core-folder':
      return `<div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center"><div style="opacity:.6;font-size:11px">FILE SYSTEM ACCESS API</div><button class="btn-full" style="max-width:220px" onclick="witnessFolder(event)">Witness Folder</button><div style="font-size:10px;opacity:.4;max-width:240px">Computes SHA-256 locally. Persists to localStorage.</div></div>`;
    case 'core-records': {
      const recs = store.akasha.witnesses.slice(-25).reverse();
      return `<div>${recs.map(r=>`<div style="padding:5px 0;border-bottom:1px solid #111;font-size:10px"><div style="display:flex;justify-content:space-between"><span>${r.name}</span><span style="opacity:.5">${new Date(r.ts).toLocaleTimeString()}</span></div><div style="color:#00ffff;opacity:.7;margin-top:2px">${r.hash}</div></div>`).join('') || '<div style="opacity:.4;text-align:center;padding:30px">no records</div>'}</div>`;
    }
    case 'core-hashes': {
      const h = store.akasha.witnesses.slice(-30);
      return `<div class="hash-list">${h.map(x=>`<div class="hash-item"><span>${x.name}</span><span>${x.hash.slice(0,12)}</span></div>`).join('') || '<div style="opacity:.4;text-align:center;padding:30px">witness to generate</div>'}</div>`;
    }
    case 'ins-claim':
      return `<div style="padding:8px"><div style="opacity:.6;font-size:10px">CLAIM NUMBER</div><div style="font-size:26px;color:#00ffff;margin:10px 0;letter-spacing:1px">${store.insurance.claim}</div><div style="font-size:11px;opacity:.7">2026 • READY</div></div>`;
    case 'ins-generate':
      return `<div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px"><button class="btn-full" style="max-width:200px" onclick="generateDemand(event)">Generate Demand</button></div>`;
    case 'ins-output': {
      const last = store.insurance.history[0];
      return `<textarea class="dark" style="height:100%" readonly>${last ? last.text : 'Generate demand to populate...'}</textarea>`;
    }
    case 'ins-history': {
      return `<div style="font-size:10px">${store.insurance.history.map(h=>`<div style="padding:6px 0;border-bottom:1px solid #111"><div style="color:#00ffff">${new Date(h.ts).toLocaleString()}</div><div style="opacity:.7">${h.claim}</div></div>`).join('') || '<div style="opacity:.4;text-align:center;padding:30px">no history</div>'}</div>`;
    }
    case 'dep-input':
      return `<div style="padding:8px"><div style="opacity:.6;font-size:10px;margin-bottom:8px">ACTION</div><input class="inp-full" value="${store.deployer.action}" oninput="updateAction(event)" onclick="event.stopPropagation()" placeholder="describe parallel action"></div>`;
    case 'dep-deploy':
      return `<div style="height:100%;display:flex;align-items:center;justify-content:center"><button class="btn-full" style="max-width:180px;padding:12px" onclick="deploy64(event)">DEPLOY 64</button></div>`;
    case 'dep-progress': {
      const p = store.deployer.deployments.filter(Boolean).length;
      return `<div style="text-align:center;padding-top:15%"><div style="font-size:54px;color:#00ffff">${p}</div><div style="opacity:.6;letter-spacing:2px">/64</div><div class="progress-bar" style="margin:18px 20px 0"><div class="progress-fill" style="width:${p/64*100}%"></div></div></div>`;
    }
    case 'dep-checklist':
      return `<div class="check-list">${store.deployer.deployments.map((d,i)=>`<div class="check-item ${d?'done':''}">${i+1}</div>`).join('')}</div>`;
    case 'jane-grid':
      return `<div class="jane-grid">${store.jane.boxes.map((on,i)=>`<div class="jane-cell ${on?'on':''}" onclick="toggleJane(event,${i})">${i+1}</div>`).join('')}</div>`;
    case 'jane-detail': {
      const sel = store.jane.selected;
      const on = store.jane.boxes[sel];
      const ts = store.jane.timestamps[sel];
      return `<div style="padding:10px"><div style="opacity:.6;font-size:10px">BOX</div><div style="font-size:36px;color:#00ffff;margin:6px 0">${sel+1}</div><div>STATUS <span style="color:${on?'#00ffff':'#fff'}">${on?'FOUND':'EMPTY'}</span></div><div style="margin-top:14px;font-size:10px;opacity:.6">π TIMESTAMP</div><div style="color:#00ffff;font-family:monospace;margin-top:4px">${ts?ts.toFixed(5):'—'}</div></div>`;
    }
    case 'jane-pi':
      return `<div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center"><div style="opacity:.6;font-size:10px;letter-spacing:2px">π TIME</div><div data-pi-now style="font-size:26px;color:#00ffff;margin:10px 0;font-family:monospace">${(Date.now()/Math.PI).toFixed(5)}</div></div>`;
    case 'jane-log': {
      const logs = Object.entries(store.jane.timestamps).sort((a,b)=>b[1]-a[1]).slice(0,24);
      return `<div style="font-size:10px">${logs.map(([i,t])=>`<div style="padding:4px 0;border-bottom:1px solid #111;display:flex;justify-content:space-between"><span>Box ${+i+1}</span><span style="color:#00ffff">${(+t).toFixed(3)}</span></div>`).join('') || '<div style="opacity:.4;text-align:center;padding:30px">no toggles</div>'}</div>`;
    }
    default: {
      const depth = currentPath.length;
      return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:.5"><div style="font-size:10px">FRACTAL</div><div style="color:#00ffff">${id.toUpperCase()}</div><div style="font-size:9px">DEPTH ${depth} • π ${(Math.PI*depth).toFixed(4)}</div></div>`;
    }
  }
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  const parts = [{name:'v0.0', level:0}];
  currentPath.forEach((id,i)=>{
    parts.push({name: getTitle(id), level:i+1});
  });
  bc.innerHTML = parts.map((p,i)=>`<span class="${i===parts.length-1?'active':''}" onclick="navigateBreadcrumb(${p.level})">${p.name}</span>${i<parts.length-1?'<span class="sep">></span>':''}`).join('');
}

window.navigateBreadcrumb = (level) => {
  currentPath = currentPath.slice(0, level);
  render();
};

window.navigateInto = (id) => {
  currentPath.push(id);
  render();
};

window.zoomOut = () => {
  if (currentPath.length > 0) {
    currentPath.pop();
    render();
  }
};

function startPi() {
  if (piInterval) clearInterval(piInterval);
  piInterval = setInterval(() => {
    const el = document.getElementById('pi');
    if (el) el.textContent = (3.1415926535 + (Date.now()%86400000)/86400000*0.00001).toFixed(6);
    document.querySelectorAll('[data-pi-now]').forEach(d => d.textContent = (Date.now()/Math.PI).toFixed(5));
  }, 100);
}

function render() {
  updateBreadcrumb();
  const root = document.getElementById('fractal-root');
  root.innerHTML = '';

  if (currentPath.length === 0) {
    const panel = document.createElement('div');
    panel.className = 'panel root-panel';
    panel.style.cssText = 'position:absolute;width:min(70vmin,500px);height:min(70vmin,500px);left:50%;top:50%;transform:translate(-50%,-50%);';
    panel.innerHTML = `<div class="panel-header"><span>AKASHA OS</span><span>v0.0</span></div>
      <div class="panel-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
        <div style="font-size:28px;letter-spacing:4px">AKASHA</div>
        <div style="color:#00ffff;font-size:14px">π <span id="pi">3.141593</span> <span class="pi-blink">_</span></div>
        <div style="font-size:10px;opacity:.5;border:1px solid #333;padding:5px 10px;letter-spacing:1px">CLICK TO FRACTALIZE</div>
        <div style="position:absolute;bottom:14px;font-size:9px;opacity:.25">FRACTAL SEED • SELF-SIMILAR</div>
      </div>`;
    panel.onclick = () => navigateInto('root');
    root.appendChild(panel);
    startPi();
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'fractal-grid';
  grid.onclick = (e) => { if (e.target === grid) zoomOut(); };
  root.appendChild(grid);

  const children = getChildren();
  children.forEach(id => {
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = `<div class="panel-header"><span>${getTitle(id)}</span><span>${currentPath.length}</span></div><div class="panel-content">${getContent(id)}</div>`;
    panel.onclick = (e) => {
      if (e.target.closest('button, input, textarea, .jane-cell, .mini-cell')) return;
      navigateInto(id);
    };
    grid.appendChild(panel);
  });
  startPi();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') zoomOut(); });
document.addEventListener('DOMContentLoaded', render);
</script>

</body></html>
