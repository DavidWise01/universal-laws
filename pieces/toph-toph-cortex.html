<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toph Cortex Cannon Array</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#000;
    color:#777;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    user-select:none;
    -webkit-font-smoothing:antialiased;
    cursor:default;
  }

  .array {
    position:relative;
    width:min(88vmin, 680px);
    height:min(88vmin, 680px);
  }

  /* cortex */
  .cortex {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:20;
    cursor:pointer;
  }
  .cortex-core {
    width:84px;
    height:84px;
    border-radius:50%;
    background:#fff;
    box-shadow:
      0 0 12px 2px #fff,
      0 0 32px 8px rgba(255,255,255,0.7),
      0 0 80px 20px rgba(255,255,255,0.25);
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .cortex:hover .cortex-core { transform:scale(1.04); }
  .cortex-label {
    margin-top:20px;
    font-size:10px;
    letter-spacing:0.38em;
    color:#8a8a8a;
    text-transform:uppercase;
  }

  /* cannons */
  .cannon {
    position:absolute;
    width:56px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
  }
  .cannon.north { top:0; left:50%; transform:translateX(-50%); }
  .cannon.south { bottom:0; left:50%; transform:translateX(-50%); }
  .cannon.east { top:50%; right:0; transform:translateY(-50%); }
  .cannon.west { top:50%; left:0; transform:translateY(-50%); }

  .ring {
    position:absolute;
    width:52px;
    height:52px;
    border:1px solid rgba(255,176,0,0.6);
    border-radius:50%;
    animation:spin 30s linear infinite;
  }
  .ring::after {
    content:'';
    position:absolute;
    top:-2px;
    left:50%;
    width:3px;
    height:3px;
    background:#FFB000;
    border-radius:50%;
    transform:translateX(-50%);
    box-shadow:0 0 4px #FFB000, 0 0 8px #FF8C00;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .plasma {
    width:9px;
    height:9px;
    background:#FFB000;
    border-radius:50%;
    box-shadow:0 0 6px #FFB000, 0 0 14px #FF8C00, 0 0 22px rgba(255,140,0,0.5);
    animation:pulse 2.2s ease-in-out infinite;
    transition:transform .18s;
  }
  @keyframes pulse {
    0%,100% { transform:scale(1); opacity:1; }
    50% { transform:scale(1.2); opacity:.88; }
  }
  .cannon.fire .plasma {
    transform:scale(1.5);
    box-shadow:0 0 10px #fff, 0 0 20px #FFB000, 0 0 32px #FF8C00;
  }

  /* beams */
  .beam {
    position:absolute;
    pointer-events:none;
    opacity:.48;
    z-index:1;
  }
  .beam.north {
    top:56px; left:50%;
    width:1px; height:calc(50% - 98px);
    transform:translateX(-50%);
    background:linear-gradient(to bottom, transparent, rgba(255,176,0,0.55) 40%, rgba(255,255,255,0.7));
  }
  .beam.south {
    bottom:56px; left:50%;
    width:1px; height:calc(50% - 98px);
    transform:translateX(-50%);
    background:linear-gradient(to top, transparent, rgba(255,176,0,0.55) 40%, rgba(255,255,255,0.7));
  }
  .beam.east {
    right:56px; top:50%;
    height:1px; width:calc(50% - 98px);
    transform:translateY(-50%);
    background:linear-gradient(to left, transparent, rgba(255,176,0,0.55) 40%, rgba(255,255,255,0.7));
  }
  .beam.west {
    left:56px; top:50%;
    height:1px; width:calc(50% - 98px);
    transform:translateY(-50%);
    background:linear-gradient(to right, transparent, rgba(255,176,0,0.55) 40%, rgba(255,255,255,0.7));
  }

  /* shots */
  .shot { position:absolute; pointer-events:none; }
  .beam.north .shot, .beam.south .shot {
    width:2px; height:16px;
    background:linear-gradient(to bottom, #fff, #FFB000);
    box-shadow:0 0 10px #fff, 0 0 16px #FFB000;
    border-radius:1px;
  }
  .beam.east .shot, .beam.west .shot {
    width:16px; height:2px;
    background:linear-gradient(to right, #fff, #FFB000);
    box-shadow:0 0 10px #fff, 0 0 16px #FFB000;
    border-radius:1px;
  }

  .meta {
    position:fixed;
    bottom:26px;
    left:0; right:0;
    text-align:center;
    font-size:10px;
    letter-spacing:0.22em;
    color:#363636;
    text-transform:uppercase;
  }

  @media (max-width:640px) {
    .cortex-core { width:68px; height:68px; }
    .cortex-label { font-size:9px; margin-top:16px; letter-spacing:0.32em; }
    .ring { width:44px; height:44px; }
    .cannon { width:48px; height:48px; }
    .beam.north, .beam.south { height:calc(50% - 82px); top:48px; bottom:48px; }
    .beam.east, .beam.west { width:calc(50% - 82px); right:48px; left:48px; }
  }
</style>
</head>
<body>
  <div class="array" id="array">
    <div class="beam north"></div>
    <div class="beam south"></div>
    <div class="beam east"></div>
    <div class="beam west"></div>

    <div class="cortex" id="cortex">
      <div class="cortex-core"></div>
      <div class="cortex-label">TOPH CORTEX</div>
    </div>

    <div class="cannon north">
      <div class="ring"></div>
      <div class="plasma"></div>
    </div>
    <div class="cannon east">
      <div class="ring"></div>
      <div class="plasma"></div>
    </div>
    <div class="cannon south">
      <div class="ring"></div>
      <div class="plasma"></div>
    </div>
    <div class="cannon west">
      <div class="ring"></div>
      <div class="plasma"></div>
    </div>
  </div>

  <div class="meta">4× Plasma Cannon — 0root.ai — 990990</div>

<script>
  const cortex = document.getElementById('cortex');
  const core = cortex.querySelector('.cortex-core');
  const cannons = document.querySelectorAll('.cannon');
  const beams = {
    n: document.querySelector('.beam.north'),
    s: document.querySelector('.beam.south'),
    e: document.querySelector('.beam.east'),
    w: document.querySelector('.beam.west')
  };
  let firing = false;

  function fireShot(beam, dir) {
    const s = document.createElement('div');
    s.className = 'shot';
    beam.appendChild(s);
    const dur = 360;
    
    if(dir === 'n') {
      s.style.left = '50%'; s.style.top = '0'; s.style.transform = 'translate(-50%,0)';
      s.animate([{top:'0', opacity:.6},{top:'100%', opacity:1}], {duration:dur, easing:'cubic-bezier(.18,.8,.2,1)'});
    } else if(dir === 's') {
      s.style.left = '50%'; s.style.top = '100%'; s.style.transform = 'translate(-50%,-100%)';
      s.animate([{top:'100%', opacity:.6},{top:'0%', opacity:1}], {duration:dur, easing:'cubic-bezier(.18,.8,.2,1)'});
    } else if(dir === 'e') {
      s.style.top = '50%'; s.style.left = '100%'; s.style.transform = 'translate(-100%,-50%)';
      s.animate([{left:'100%', opacity:.6},{left:'0%', opacity:1}], {duration:dur, easing:'cubic-bezier(.18,.8,.2,1)'});
    } else {
      s.style.top = '50%'; s.style.left = '0'; s.style.transform = 'translate(0,-50%)';
      s.animate([{left:'0', opacity:.6},{left:'100%', opacity:1}], {duration:dur, easing:'cubic-bezier(.18,.8,.2,1)'});
    }
    setTimeout(()=> s.remove(), dur+30);
  }

  function fire() {
    if(firing) return;
    firing = true;
    cannons.forEach(c => c.classList.add('fire'));
    
    fireShot(beams.n, 'n');
    fireShot(beams.e, 'e');
    fireShot(beams.s, 's');
    fireShot(beams.w, 'w');

    setTimeout(() => {
      core.style.transform = 'scale(1.2)';
      core.style.boxShadow = '0 0 18px 3px #fff, 0 0 48px 12px rgba(255,255,255,0.9), 0 0 110px 28px rgba(255,176,0,0.45)';
      setTimeout(() => {
        core.style.transform = 'scale(1)';
        core.style.boxShadow = '0 0 12px 2px #fff, 0 0 32px 8px rgba(255,255,255,0.7), 0 0 80px 20px rgba(255,255,255,0.25)';
        cannons.forEach(c => c.classList.remove('fire'));
        firing = false;
      }, 260);
    }, 340);
  }

  cortex.addEventListener('click', fire);
  document.getElementById('array').addEventListener('click', e => { if(e.target.id === 'array') fire(); });
  window.addEventListener('keydown', e => { if(e.code === 'Space' || e.key === 'Enter') fire(); });
</script>
</body>
</html>
