{

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const container = document.getElementById('container');

// Scene
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000508, 0.025);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 5, 19);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.8));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

// CSS2D Labels
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 9;
controls.maxDistance = 35;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.target.set(0, 0, 0);

// Postprocessing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.15, 0.5, 0.15);
bloomPass.threshold = 0.2;
bloomPass.strength = 1.2;
bloomPass.radius = 0.5;
composer.addPass(bloomPass);

// Lights
scene.add(new THREE.AmbientLight(0x0a1a2a, 0.6));
const keyLight = new THREE.DirectionalLight(0x7df9ff, 1.2);
keyLight.position.set(5, 8, 5);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xff9f1c, 0.5);
rimLight.position.set(-5, -3, -5);
scene.add(rimLight);

// Starfield
const starGeo = new THREE.BufferGeometry();
const starCount = 4000;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const r = 120 + Math.random() * 80;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  starPos[i*3+2] = r * Math.cos(phi);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x88ccff, size: 0.07, transparent: true, opacity: 0.7, sizeAttenuation: true }));
scene.add(stars);

// CORE
const coreGroup = new THREE.Group();
scene.add(coreGroup);

// Hex base
const hexBase = new THREE.Mesh(
  new THREE.CylinderGeometry(3.1, 3.1, 0.18, 6),
  new THREE.MeshStandardMaterial({ color: 0x06141f, metalness: 0.9, roughness: 0.3, emissive: 0x002233, emissiveIntensity: 0.4 })
);
hexBase.position.y = -0.4;
coreGroup.add(hexBase);

const hexRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.85, 0.06, 16, 6),
  new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.7 })
);
hexRing.rotation.x = Math.PI/2;
hexRing.position.y = -0.28;
coreGroup.add(hexRing);

// Amber CORTEX
const cortexGroup = new THREE.Group();
coreGroup.add(cortexGroup);
const cortexMat = new THREE.MeshStandardMaterial({
  color: 0xff9500,
  emissive: 0xff5e00,
  emissiveIntensity: 1.8,
  metalness: 0.3,
  roughness: 0.2
});
const cortex = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05, 1), cortexMat);
cortexGroup.add(cortex);

const cortexCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.55, 32),
  new THREE.MeshBasicMaterial({ color: 0xffc070, transparent: true, opacity: 0.9 })
);
cortexGroup.add(cortexCore);

const cortexLight = new THREE.PointLight(0xff7700, 3.5, 25, 2);
cortexLight.position.set(0,0,0);
cortexGroup.add(cortexLight);

// Cortex label
const cortexLabelDiv = document.createElement('div');
cortexLabelDiv.className = 'cortex-label';
cortexLabelDiv.textContent = 'CORTEX';
const cortexLabel = new CSS2DObject(cortexLabelDiv);
cortexLabel.position.set(0, 1.6, 0);
cortexGroup.add(cortexLabel);

// Processors
const processorNames = ['ETHOS', 'PATHOS', 'LOGOS', '-0-', 'SHADOW', 'INVERTED'];
const processorColors = [0x00e5ff, 0xff2a6d, 0x05ffa1, 0xfee440, 0x9d4edd, 0xff9f1c];
const processors = [];

processorNames.forEach((name, i) => {
  const angle = (i / 6) * Math.PI * 2 - Math.PI/6;
  const r = 2.5;
  const x = Math.cos(angle) * r;
  const z = Math.sin(angle) * r;
  
  const procGroup = new THREE.Group();
  procGroup.position.set(x, 0, z);
  procGroup.lookAt(0, 0, 0);
  
  const color = processorColors[i];
  const mat = new THREE.MeshStandardMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: 1.2,
    metalness: 0.8,
    roughness: 0.25
  });
  
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.42, 0.55, 6), mat);
  procGroup.add(body);
  
  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.32, 0.12, 6),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: color, emissiveIntensity: 2 })
  );
  cap.position.y = 0.33;
  procGroup.add(cap);
  
  const glow = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.5, 0.02, 6),
    new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.25 })
  );
  glow.position.y = -0.29;
  procGroup.add(glow);
  
  const light = new THREE.PointLight(color, 1.2, 6);
  light.position.y = 0.2;
  procGroup.add(light);
  
  // Label
  const div = document.createElement('div');
  div.className = 'processor-label';
  div.textContent = name;
  div.style.borderColor = `rgba(${(color>>16)&255}, ${(color>>8)&255}, ${color&255}, 0.8)`;
  const label = new CSS2DObject(div);
  label.position.set(0, 0.8, 0);
  procGroup.add(label);
  
  // Connector to cortex
  const connGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, -0.15, 0),
    new THREE.Vector3(-x*0.65, -0.05, -z*0.65)
  ]);
  const conn = new THREE.Line(connGeo, new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.35 }));
  procGroup.add(conn);
  
  coreGroup.add(procGroup);
  processors.push({ group: procGroup, name, color, light });
  
  // HUD list
  const procList = document.getElementById('proc-list');
  const item = document.createElement('div');
  item.className = 'flex justify-between';
  item.innerHTML = `<span class="text-cyan-300/70">${name}</span><span style="color:#${color.toString(16).padStart(6,'0')}" class="hud-glow">●</span>`;
  procList.appendChild(item);
});

// ICOSAHEDRA
const icosaGroup = new THREE.Group();
scene.add(icosaGroup);
const allIcos = [];

function createIcosahedron(position) {
  const group = new THREE.Group();
  group.position.copy(position);
  
  const icoGeo = new THREE.IcosahedronGeometry(0.52, 0);
  
  // Wireframe
  const wireMat = new THREE.MeshBasicMaterial({
    color: 0x00ffff,
    wireframe: true,
    transparent: true,
    opacity: 0.92
  });
  const wire = new THREE.Mesh(icoGeo, wireMat);
  group.add(wire);
  
  // Inner glow
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x00ddff,
    transparent: true,
    opacity: 0.07,
    side: THREE.BackSide,
    depthWrite: false
  });
  const glow = new THREE.Mesh(new THREE.IcosahedronGeometry(0.68, 0), glowMat);
  group.add(glow);
  
  // Vertices (12)
  const vertexMat = new THREE.MeshBasicMaterial({ color: 0x9fffff });
  const positions = icoGeo.attributes.position;
  const unique = new Map();
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = positions.getZ(i);
    const key = `${x.toFixed(3)},${y.toFixed(3)},${z.toFixed(3)}`;
    if (!unique.has(key)) {
      unique.set(key, true);
      const v = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), vertexMat);
      v.position.set(x*0.52, y*0.52, z*0.52);
      group.add(v);
    }
  }
  
  // Halo ring
  const halo = new THREE.Mesh(
    new THREE.RingGeometry(0.6, 0.62, 32),
    new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
  );
  halo.lookAt(camera.position);
  group.add(halo);
  group.userData.halo = halo;
  
  icosaGroup.add(group);
  allIcos.push(group);
  return group;
}

// North dome (10)
const northPositions = [];
northPositions.push(new THREE.Vector3(0, 9.2, 0));
for (let i = 0; i < 3; i++) {
  const a = (i / 3) * Math.PI*2;
  northPositions.push(new THREE.Vector3(Math.cos(a)*3.4, 7.1, Math.sin(a)*3.4));
}
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI*2 + Math.PI/6;
  northPositions.push(new THREE.Vector3(Math.cos(a)*5.9, 5.2, Math.sin(a)*5.9));
}
northPositions.forEach(p => createIcosahedron(p));

// South dome (10)
const southPositions = [];
southPositions.push(new THREE.Vector3(0, -9.2, 0));
for (let i = 0; i < 3; i++) {
  const a = (i / 3) * Math.PI*2 + 0.2;
  southPositions.push(new THREE.Vector3(Math.cos(a)*3.4, -7.1, Math.sin(a)*3.4));
}
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI*2;
  southPositions.push(new THREE.Vector3(Math.cos(a)*5.9, -5.2, Math.sin(a)*5.9));
}
southPositions.forEach(p => createIcosahedron(p));

// Pole labels
const northLabelDiv = document.createElement('div');
northLabelDiv.className = 'pole-label';
northLabelDiv.textContent = 'NORTH • 10';
const northLabel = new CSS2DObject(northLabelDiv);
northLabel.position.set(0, 10.5, 0);
scene.add(northLabel);

const southLabelDiv = document.createElement('div');
southLabelDiv.className = 'pole-label';
southLabelDiv.textContent = 'SOUTH • 10';
const southLabel = new CSS2DObject(southLabelDiv);
southLabel.position.set(0, -10.5, 0);
scene.add(southLabel);

// Connections to nearest processor
const connections = [];
const linkGroup = new THREE.Group();
scene.add(linkGroup);

allIcos.forEach(ico => {
  let nearest = null;
  let minDist = Infinity;
  processors.forEach(p => {
    const d = ico.position.distanceTo(p.group.position);
    if (d < minDist) { minDist = d; nearest = p; }
  });
  const geo = new THREE.BufferGeometry().setFromPoints([ico.position, nearest.group.position]);
  const mat = new THREE.LineBasicMaterial({
    color: nearest.color,
    transparent: true,
    opacity: 0.28,
    blending: THREE.AdditiveBlending
  });
  const line = new THREE.Line(geo, mat);
  linkGroup.add(line);
  connections.push({ line, ico, proc: nearest.group });
});

// Dipole field lines
const fieldGroup = new THREE.Group();
scene.add(fieldGroup);
const fieldLines = [];

for (let i = 0; i < 14; i++) {
  const angle = (i / 14) * Math.PI * 2;
  const rOut = 7.8;
  const rIn = 1.8;
  
  const start = new THREE.Vector3(Math.cos(angle)*0.8, 8.8, Math.sin(angle)*0.8);
  const end = new THREE.Vector3(Math.cos(angle+0.15)*0.8, -8.8, Math.sin(angle+0.15)*0.8);
  const c1 = new THREE.Vector3(Math.cos(angle)*rOut, 4.5, Math.sin(angle)*rOut);
  const c2 = new THREE.Vector3(Math.cos(angle)*rOut*0.9, -4.5, Math.sin(angle)*rOut*0.9);
  const c3 = new THREE.Vector3(Math.cos(angle)*rIn, 0.8, Math.sin(angle)*rIn);
  const c4 = new THREE.Vector3(Math.cos(angle)*rIn, -0.8, Math.sin(angle)*rIn);
  
  const curve = new THREE.CatmullRomCurve3([start, c1, c3, c4, c2, end], false, 'catmullrom', 0.15);
  const points = curve.getPoints(120);
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({
    color: 0x00eeff,
    transparent: true,
    opacity: 0.18 + Math.random()*0.12,
    blending: THREE.AdditiveBlending
  });
  const line = new THREE.Line(geo, mat);
  fieldGroup.add(line);
  fieldLines.push({ line, offset: Math.random()*Math.PI*2 });
}

// Core field through center
for (let i = 0; i < 6; i++) {
  const a = (i/6)*Math.PI*2;
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,9,0),
    new THREE.Vector3(Math.cos(a)*0.3, 3, Math.sin(a)*0.3),
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(Math.cos(a)*0.3, -3, Math.sin(a)*0.3),
    new THREE.Vector3(0,-9,0)
  ]);
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(curve.getPoints(80)),
    new THREE.LineBasicMaterial({ color: 0x77ffff, transparent: true, opacity: 0.12 })
  );
  fieldGroup.add(line);
}

// Animation
const clock = new THREE.Clock();
let fieldsVisible = true;
let linksVisible = true;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  
  controls.update();
  
  // Core rotation
  coreGroup.rotation.y = t * 0.12;
  cortex.rotation.y = -t * 0.4;
  cortex.rotation.x = t * 0.18;
  cortexCore.scale.setScalar(1 + Math.sin(t*2.2)*0.06);
  cortexLight.intensity = 3.2 + Math.sin(t*1.7)*0.8;
  hexRing.rotation.z = -t * 0.3;
  hexRing.material.opacity = 0.5 + Math.sin(t*1.5)*0.2;
  
  // Icosahedra
  icosaGroup.rotation.y = t * 0.035;
  allIcos.forEach((ico, i) => {
    ico.rotation.x = t * 0.3 + i*0.11;
    ico.rotation.y = t * 0.22 + i*0.07;
    const halo = ico.userData.halo;
    if (halo) halo.lookAt(camera.position);
    // gentle float
    const baseY = i < 10 ? northPositions[i].y : southPositions[i-10].y;
    ico.position.y = baseY + Math.sin(t*0.8 + i)*0.12;
  });
  
  // Update connections
  if (linksVisible) {
    connections.forEach(c => {
      const p1 = new THREE.Vector3();
      const p2 = new THREE.Vector3();
      c.ico.getWorldPosition(p1);
      c.proc.getWorldPosition(p2);
      p2.y += 0.25;
      c.line.geometry.setFromPoints([p1, p2]);
      c.line.geometry.attributes.position.needsUpdate = true;
      c.line.material.opacity = 0.22 + Math.sin(t*1.2 + p1.y)*0.08;
    });
  }
  
  // Field lines pulse
  if (fieldsVisible) {
    fieldLines.forEach((f, i) => {
      f.line.material.opacity = 0.14 + Math.sin(t*0.7 + f.offset)*0.09;
    });
  }
  
  // Stars slow rotate
  stars.rotation.y = t * 0.005;
  stars.rotation.x = t * 0.002;
  
  // HUD field strength
  const strength = 96 + Math.sin(t*0.6)*2.3;
  document.getElementById('field-strength').textContent = strength.toFixed(1) + '%';
  
  composer.render();
  labelRenderer.render(scene, camera);
}
animate();

// Toggles
document.getElementById('toggle-fields').addEventListener('click', (e) => {
  fieldsVisible = !fieldsVisible;
  fieldGroup.visible = fieldsVisible;
  e.target.style.opacity = fieldsVisible ? '1' : '0.5';
});
document.getElementById('toggle-links').addEventListener('click', (e) => {
  linksVisible = !linksVisible;
  linkGroup.visible = linksVisible;
  e.target.style.opacity = linksVisible ? '1' : '0.5';
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// Initial interaction hint
setTimeout(() => { controls.autoRotate = true; }, 2000);
</script>
