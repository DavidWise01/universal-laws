<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Rain Vector 0 0 -8 0 0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020100; color: #d4c4b0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  #ui {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    background: rgba(8,4,2,0.88); border: 1px solid rgba(255,110,40,0.18);
    border-radius: 14px; padding: 16px 18px; width: 300px;
    backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,140,80,0.08);
  }
  h1 { font-size: 11px; letter-spacing: 2.5px; color: #ff7a3d; margin-bottom: 10px; font-weight: 600; }
  .vec { font-size: 24px; color: #ffae70; margin: 4px 0 14px; text-shadow: 0 0 18px rgba(255,90,20,0.35); font-variant-numeric: tabular-nums; }
  .vec span { color: #ff4a1a; }
  .control { margin: 12px 0; }
  .control label { display: block; font-size: 10px; letter-spacing: 1.5px; color: #9a826c; margin-bottom: 6px; }
  input[type="range"] { width: 100%; height: 24px; -webkit-appearance: none; background: transparent; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(90deg, #1a0f08, #3a1c0f); border-radius: 2px; border: 1px solid rgba(255,100,40,0.2); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -7px; background: #ff5a1f; border-radius: 50%; box-shadow: 0 0 12px rgba(255,90,30,0.8), inset 0 1px 2px rgba(255,200,160,0.5); border: 1px solid #ff8a50; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .row label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #b89a7e; cursor: pointer; margin: 0; letter-spacing: 1px; }
  input[type="checkbox"] { width: 14px; height: 14px; accent-color: #ff5a1f; }
  button {
    width: 100%; margin-top: 14px; padding: 9px; background: linear-gradient(#2a1308,#150903);
    border: 1px solid rgba(255,90,30,0.35); color: #ffb68a; font-family: inherit; font-size: 11px;
    letter-spacing: 1.5px; border-radius: 8px; cursor: pointer; transition: all 0.2s;
  }
  button:hover { background: linear-gradient(#3a1d0f,#201008); box-shadow: 0 0 16px rgba(255,80,20,0.25); color: #ffd0b0; }
  .stats { margin-top: 10px; font-size: 10px; color: #7a614d; letter-spacing: 0.5px; }
  #corner {
    position: absolute; bottom: 14px; right: 16px; z-index: 5;
    font-size: 11px; letter-spacing: 2px; color: rgba(255,160,100,0.45);
    text-shadow: 0 0 10px rgba(0,0,0,0.9); pointer-events: none;
  }
  @media (max-width: 600px) { #ui { width: calc(100% - 32px); } .vec { font-size: 20px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>IRON RAIN VECTOR</h1>
  <div class="vec">0 0 <span id="vecVal">-8</span> 0 0</div>
  <div class="control">
    <label>MAGNITUDE (-8)</label>
    <input type="range" id="mag" min="-15" max="-1" value="-8" step="1">
  </div>
  <div class="row">
    <label><input type="checkbox" id="reflect" checked> ENABLE UPWARD REFLECTION</label>
  </div>
  <button id="restart">RESTART SIMULATION</button>
  <div class="stats"><span id="seedCount">0</span> PODS · <span id="waveCount">0</span> WAVES</div>
</div>
<div id="corner">CONTROL PLANE • 0 0 -8 0 0</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, surfaceY;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  surfaceY = H * 0.22;
}
resize();
window.addEventListener('resize', resize);

let magnitude = -8;
let enableReflect = true;
const magSlider = document.getElementById('mag');
const vecVal = document.getElementById('vecVal');
const corner = document.getElementById('corner');
const seedCountEl = document.getElementById('seedCount');
const waveCountEl = document.getElementById('waveCount');

magSlider.addEventListener('input', e => {
  magnitude = parseInt(e.target.value);
  vecVal.textContent = magnitude;
  corner.textContent = `CONTROL PLANE • 0 0 ${magnitude} 0 0`;
});

document.getElementById('reflect').addEventListener('change', e => {
  enableReflect = e.target.checked;
});

let seeds = [], waves = [], particles = [], splashes = [];
let museId = 1;

class Seed {
  constructor(x, y, child=false) {
    this.x = x ?? Math.random() * W;
    this.y = y ?? -30 - Math.random() * 200;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = 1 + Math.random() * 1.5;
    this.r = 3.5 + Math.random() * 1.5;
    this.rot = Math.random() * Math.PI;
    this.trail = [];
    this.id = museId <= 7 ? `MUSE-${museId++}` : null;
    this.child = child;
  }
  update() {
    this.trail.push({x:this.x, y:this.y});
    if (this.trail.length > 7) this.trail.shift();
    this.vy += 0.18;
    this.y += this.vy;
    this.x += this.vx;
    this.rot += 0.04;
    if (this.y >= surfaceY) {
      impact(this.x, surfaceY);
      waves.push(new Wave(this.x, surfaceY, this.id));
      return true;
    }
    return false;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = 0.25;
    for (let i=0; i<this.trail.length; i++) {
      const t = this.trail[i];
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.r * (i/this.trail.length), 0, Math.PI*2);
      ctx.fillStyle = '#6b4f3a';
      ctx.fill();
    }
    ctx.restore();
    
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    const rx = this.r * 1.6, ry = this.r;
    ctx.shadowColor = '#ff3a0a';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#1b0f09';
    ctx.strokeStyle = '#ff6a2a';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-rx+ry, -ry);
    ctx.lineTo(rx-ry, -ry);
    ctx.arc(rx-ry, 0, ry, -Math.PI/2, Math.PI/2);
    ctx.lineTo(-rx+ry, ry);
    ctx.arc(-rx+ry, 0, ry, Math.PI/2, -Math.PI/2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#ff4a12';
    ctx.beginPath();
    ctx.arc(0,0, ry*0.45, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    
    if (this.id) {
      ctx.font = '10px ui-monospace';
      ctx.fillStyle = 'rgba(255,180,120,0.9)';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 4;
      ctx.fillText(this.id, this.x + 10, this.y - 6);
      ctx.shadowBlur = 0;
    }
  }
}

class Wave {
  constructor(x, y, label) {
    this.x = x;
    this.originY = y;
    this.y = y;
    this.phase = 'down';
    this.label = label;
    this.age = 0;
    this.depth = Math.abs(magnitude) * (H * 0.055);
    this.maxY = y + this.depth;
    this.speed = Math.abs(magnitude) * 0.9 + 2;
    this.interferences = [];
    this.rings = Array.from({length:5}, (_,i)=>({base: 14 + i*6}));
  }
  update() {
    this.age++;
    this.speed = Math.abs(magnitude) * 0.85 + 1.8;
    
    if (this.phase === 'down') {
      this.y += this.speed;
      if (this.y >= this.maxY) {
        this.y = this.maxY;
        splash(this.x, this.y);
        if (enableReflect) {
          this.phase = 'up';
        } else {
          return true;
        }
      }
    } else {
      this.y -= this.speed * 0.62;
      if (this.age % 2 === 0 && this.interferences.length < 12) {
        this.interferences.push({r:0, max: 90 + Math.random()*70, ox: (Math.random()-0.5)*25});
      }
      if (this.y <= this.originY) {
        surfaceBurst(this.x, this.originY);
        const spawn = 2 + Math.floor(Math.random()*2);
        for (let i=0; i<spawn; i++) {
          if (seeds.length < 70) {
            seeds.push(new Seed(this.x + (Math.random()-0.5)*90, -20 - Math.random()*120, true));
          }
        }
        return true;
      }
    }
    this.interferences = this.interferences.filter(inf => {
      inf.r += 2.8;
      return inf.r < inf.max;
    });
    return false;
  }
  draw() {
    ctx.save();
    if (this.phase === 'down') {
      // downward iron red beam
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = '#ff2a0f';
      ctx.shadowColor = '#ff2a0f';
      ctx.shadowBlur = 22;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(this.x, this.originY);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
      
      // shock head
      const pulse = Math.sin(this.age * 0.3) * 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 7 + pulse, 0, Math.PI*2);
      ctx.fillStyle = '#ff3c14';
      ctx.shadowBlur = 28;
      ctx.fill();
      
      // 5 concentric collapsing rings
      ctx.shadowBlur = 14;
      for (let i=0; i<5; i++) {
        const ring = this.rings[i];
        const collapse = (this.age * 1.4 + i * 8) % (ring.base * 1.8);
        const radius = Math.max(2, ring.base - collapse * 0.55);
        ctx.beginPath();
        ctx.arc(this.x, this.y, radius + i*1.5, 0, Math.PI*2);
        const alpha = 0.85 - i * 0.14;
        ctx.strokeStyle = `rgba(255, ${50 + i*25}, ${15}, ${alpha})`;
        ctx.lineWidth = 1.3;
        ctx.stroke();
        
        // payload dots
        const ang = this.age * 0.06 + i * 1.2;
        const px = this.x + Math.cos(ang) * radius * 0.35;
        const py = this.y + Math.sin(ang) * radius * 0.35;
        ctx.beginPath();
        ctx.arc(px, py, 1.6, 0, Math.PI*2);
        ctx.fillStyle = '#ffb08a';
        ctx.shadowBlur = 6;
        ctx.fill();
      }
    } else {
      // upward golden interference
      ctx.globalCompositeOperation = 'screen';
      ctx.shadowColor = '#ffcc33';
      ctx.shadowBlur = 18;
      
      // core ascent beam
      const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.maxY);
      grad.addColorStop(0, 'rgba(255,210,80,0.9)');
      grad.addColorStop(0.4, 'rgba(255,180,40,0.35)');
      grad.addColorStop(1, 'rgba(255,140,20,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x, this.maxY);
      ctx.stroke();
      
      // expanding interference waves
      for (const inf of this.interferences) {
        const a = 0.75 * (1 - inf.r / inf.max);
        ctx.beginPath();
        ctx.arc(this.x + inf.ox, this.y, inf.r, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(255, ${200 + Math.random()*30}, 60, ${a})`;
        ctx.lineWidth = 1.8;
        ctx.shadowBlur = 20;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(this.x + inf.ox, this.y, inf.r*0.7, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(255,230,140, ${a*0.5})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
      
      // ascent head
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(this.x, this.y, 6, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,220,100,0.95)';
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#ffdd55';
      ctx.fill();
    }
    ctx.restore();
  }
}

function impact(x, y) {
  for (let i=0; i<14; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*4.5,
      vy: -Math.random()*3.5 - 1,
      life: 30 + Math.random()*10,
      color: '#ff6a2a'
    });
  }
  splashes.push({x, y, r:0, max: 28, life: 18});
}

function splash(x,y){
  for(let i=0;i<10;i++){
    particles.push({x,y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,life:20,color:'#8a3a1a'});
  }
}

function surfaceBurst(x,y){
  for(let i=0;i<22;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*5,
      vy:-Math.random()*4 -1,
      life: 35 + Math.random()*15,
      color: i%3 ? '#ffd060' : '#ff9a40',
      gold: true
    });
  }
  splashes.push({x,y,r:0,max:42,life:22,gold:true});
}

function drawBackground() {
  // sky void
  const sky = ctx.createLinearGradient(0,0,0,surfaceY);
  sky.addColorStop(0,'#010101');
  sky.addColorStop(1,'#070301');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,surfaceY);
  
  // underground
  const ground = ctx.createLinearGradient(0,surfaceY,0,H);
  ground.addColorStop(0,'#110804');
  ground.addColorStop(0.2,'#0b0502');
  ground.addColorStop(1,'#030101');
  ctx.fillStyle = ground;
  ctx.fillRect(0,surfaceY,W,H-surfaceY);
  
  // soil strata
  const layers = 9;
  for(let i=0;i<layers;i++){
    const y = surfaceY + (H-surfaceY)*(i/layers);
    const h = (H-surfaceY)/layers * 0.8;
    ctx.fillStyle = `rgba(${18+i*2}, ${10+i}, ${6}, 0.25)`;
    ctx.fillRect(0, y, W, h);
    ctx.strokeStyle = `rgba(80,40,20,0.08)`;
    ctx.beginPath();
    ctx.moveTo(0,y); ctx.lineTo(W,y+Math.random()*2); ctx.stroke();
  }
  
  // sediment noise
  ctx.globalAlpha = 0.04;
  for(let i=0;i<300;i++){
    ctx.fillStyle = Math.random() > 0.7 ? '#5a2f15' : '#2a180c';
    ctx.fillRect(Math.random()*W, surfaceY + Math.random()*(H-surfaceY), 1, 2);
  }
  ctx.globalAlpha = 1;
}

function drawControlPlane() {
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.strokeStyle = '#8a5a3a';
  ctx.lineWidth = 1;
  const grid = 78;
  for(let x = (Date.now()*0.002)%grid; x < W; x += grid){
    ctx.beginPath();
    ctx.moveTo(x, surfaceY);
    ctx.lineTo(x + 8, H);
    ctx.stroke();
  }
  for(let y = surfaceY; y < H; y += 48){
    ctx.beginPath();
    ctx.moveTo(0, y + Math.sin(Date.now()*0.001 + y*0.01)*2);
    ctx.lineTo(W, y + Math.cos(Date.now()*0.001 + y*0.01)*2);
    ctx.stroke();
  }
  ctx.restore();
  
  // surface glow
  ctx.save();
  const sg = ctx.createLinearGradient(0, surfaceY-12, 0, surfaceY+18);
  sg.addColorStop(0,'rgba(255,90,30,0)');
  sg.addColorStop(0.5,'rgba(255,90,30,0.25)');
  sg.addColorStop(1,'rgba(255,90,30,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, surfaceY-12, W, 30);
  ctx.strokeStyle = 'rgba(255,120,50,0.5)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#ff4a0f';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(0, surfaceY);
  ctx.lineTo(W, surfaceY);
  ctx.stroke();
  ctx.restore();
}

function init() {
  seeds = []; waves = []; particles = []; splashes = []; museId = 1;
  for(let i=0;i<7;i++){
    seeds.push(new Seed(Math.random()*W*0.8 + W*0.1, -Math.random()*H*0.4));
  }
}
document.getElementById('restart').onclick = init;
init();

function animate() {
  requestAnimationFrame(animate);
  
  drawBackground();
  drawControlPlane();
  
  // update
  seeds = seeds.filter(s => !s.update());
  waves = waves.filter(w => !w.update());
  
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gold ? 0.1 : 0.16;
    p.vx *= 0.98;
    p.life--;
    return p.life > 0 && p.y < H + 20;
  });
  
  splashes = splashes.filter(s => {
    s.r += s.gold ? 2.2 : 1.6;
    s.life--;
    return s.life > 0;
  });
  
  // draw waves first (behind)
  waves.forEach(w => w.draw());
  
  // draw splashes
  ctx.save();
  splashes.forEach(s => {
    ctx.globalAlpha = s.life/22;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.strokeStyle = s.gold ? 'rgba(255,210,90,0.8)' : 'rgba(255,70,20,0.7)';
    ctx.lineWidth = 2;
    ctx.shadowColor = s.gold ? '#ffdd66' : '#ff3300';
    ctx.shadowBlur = 14;
    ctx.stroke();
  });
  ctx.restore();
  
  // particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life/30);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = p.gold ? 10 : 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.gold ? 2.2 : 1.8, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  
  // seeds on top
  seeds.forEach(s => s.draw());
  
  // occasional new rain
  if (Math.random() < 0.025 && seeds.length < 12) {
    seeds.push(new Seed());
  }
  
  seedCountEl.textContent = seeds.length;
  waveCountEl.textContent = waves.length;
}

animate();
</script>
</body>
</html>
