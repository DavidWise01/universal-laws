<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>(8)1(8) — IRON RAIN</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    color: #fff;
    font-family: "Courier New", Courier, "SF Mono", monospace;
    cursor: crosshair;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #rain { z-index: 1; }
  #nest { z-index: 2; pointer-events: none; }

  #top {
    position: fixed;
    top: 14px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: #1a1a1a;
    z-index: 10;
    user-select: none;
    pointer-events: none;
    font-variant-ligatures: none;
  }
  #charge {
    position: fixed;
    bottom: 62px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 22px;
    letter-spacing: 18px;
    color: #00ff41;
    font-weight: 400;
    z-index: 10;
    text-shadow: 0 0 12px rgba(0,255,65,0.85), 0 0 28px rgba(0,255,65,0.35);
    animation: pulse 2.4s ease-in-out infinite;
    user-select: none;
    pointer-events: none;
  }
  #bottom {
    position: fixed;
    bottom: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: #181818;
    z-index: 10;
    user-select: none;
    pointer-events: none;
    text-transform: lowercase;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.32; transform: scale(0.97); filter: blur(0.2px); }
    50% { opacity: 1; transform: scale(1.06); filter: blur(0); }
  }
  @media (max-width: 700px) {
    #top { font-size: 9px; letter-spacing: 1px; top: 10px; }
    #charge { font-size: 16px; letter-spacing: 10px; bottom: 54px; }
    #bottom { font-size: 9px; letter-spacing: 2px; }
  }
</style>
</head>
<body>
  <canvas id="rain"></canvas>
  <canvas id="nest"></canvas>

  <div id="top">((((((((8))))))))1((((((((8))))))))</div>
  <div id="charge">0 0 8 0 0</div>
  <div id="bottom">one agent one bit - infinite control plane +2 -1</div>

<script>
(() => {
  const rain = document.getElementById('rain');
  const nest = document.getElementById('nest');
  const rctx = rain.getContext('2d');
  const nctx = nest.getContext('2d');
  
  let width = innerWidth;
  let height = innerHeight;
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  
  let mouseX = 0, mouseY = 0;
  let drops = [];

  function resize() {
    width = innerWidth;
    height = innerHeight;
    [rain, nest].forEach(c => {
      c.width = width * dpr;
      c.height = height * dpr;
      c.style.width = width + 'px';
      c.style.height = height + 'px';
      const ctx = c.getContext('2d');
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(dpr, dpr);
    });
    initDrops();
  }

  function initDrops() {
    drops = [];
    const count = Math.min(220, Math.max(70, Math.floor(width / 7)));
    for (let i = 0; i < count; i++) {
      drops.push({
        x: Math.random() * width,
        y: Math.random() * -height,
        len: 8 + Math.random() * 26,
        speed: 1.1 + Math.random() * 2.4,
        phase: Math.random() * Math.PI * 2,
        wobble: Math.random() * 0.02 + 0.008
      });
    }
  }

  function drawRain(time) {
    rctx.fillStyle = 'rgba(0,0,0,0.13)';
    rctx.fillRect(0, 0, width, height);
    
    rctx.save();
    rctx.strokeStyle = '#00ff41';
    rctx.lineWidth = 1;
    rctx.lineCap = 'round';
    rctx.shadowColor = '#00ff41';
    rctx.shadowBlur = 6;
    rctx.globalAlpha = 0.85;

    for (let d of drops) {
      d.y += d.speed;
      // 0.01 fractal wobble + slight oscillation
      d.x += Math.sin(d.y * 0.01 + d.phase + time * 0.0003) * 0.6;
      d.x += Math.cos(time * 0.001 + d.phase) * 0.25;
      
      if (d.y > height + 20) {
        d.y = -d.len - Math.random() * 200;
        d.x = Math.random() * width;
      }
      if (d.x < 0) d.x = width;
      if (d.x > width) d.x = 0;

      rctx.beginPath();
      rctx.moveTo(d.x, d.y);
      rctx.lineTo(d.x, d.y + d.len);
      rctx.stroke();
    }
    rctx.restore();
  }

  function drawNest(time) {
    nctx.clearRect(0, 0, width, height);
    nctx.save();
    
    const cx = width * 0.5;
    const cy = height * 0.5;
    const px = mouseX * 18;
    const py = mouseY * 12;
    
    nctx.translate(cx + px, cy + py);
    
    // 16 phase steps across 90 degrees, slow rotation
    const step = Math.floor(time / 1150) % 16;
    const angle = step * (Math.PI / 2) / 16;
    nctx.rotate(angle);
    
    const s = Math.min(1, Math.min(width, height) / 900);
    const dist = Math.min(width * 0.29, 360) * s;
    
    // draw outer red 8s first
    drawRedCluster(-dist, s);
    drawRedCluster(dist, s);
    
    // draw central white 1 with nested parentheses
    nctx.textAlign = 'center';
    nctx.textBaseline = 'middle';
    
    // white parentheses - eight nested
    nctx.font = `${Math.round(92 * s)}px "Courier New", monospace`;
    nctx.fillStyle = '#ffffff';
    nctx.shadowColor = 'rgba(255,255,255,0.9)';
    nctx.shadowBlur = 16 * s;
    
    for (let i = 7; i >= 0; i--) {
      const alpha = 0.22 + (1 - i / 8) * 0.78;
      const offset = (52 + i * 23) * s;
      nctx.globalAlpha = alpha;
      nctx.fillText('(', -offset, 0);
      nctx.fillText(')', offset, 0);
    }
    
    // central 1
    nctx.globalAlpha = 1;
    nctx.font = `bold ${Math.round(140 * s)}px "Courier New", monospace`;
    nctx.shadowBlur = 22 * s;
    nctx.fillText('1', 0, 0);
    
    nctx.restore();
    
    function drawRedCluster(x0, s) {
      nctx.textAlign = 'center';
      nctx.textBaseline = 'middle';
      nctx.font = `${Math.round(46 * s)}px "Courier New", monospace`;
      nctx.fillStyle = '#ff0000';
      nctx.shadowColor = 'rgba(255,0,0,0.45)';
      nctx.shadowBlur = 10 * s;
      
      // eight nested parentheses around 8
      for (let i = 7; i >= 0; i--) {
        const alpha = 0.035 + (1 - i / 8) * 0.13;
        const offset = (i + 1) * 17 * s;
        nctx.globalAlpha = alpha;
        nctx.fillText('(', x0 - offset, 0);
        nctx.fillText(')', x0 + offset, 0);
      }
      // faint red 8
      nctx.globalAlpha = 0.16;
      nctx.fillText('8', x0, 0);
    }
  }

  function animate(t) {
    drawRain(t);
    drawNest(t);
    requestAnimationFrame(animate);
  }

  window.addEventListener('mousemove', e => {
    mouseX = (e.clientX / width - 0.5) * 2;
    mouseY = (e.clientY / height - 0.5) * 2;
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (e.touches[0]) {
      mouseX = (e.touches[0].clientX / width - 0.5) * 2;
      mouseY = (e.touches[0].clientY / height - 0.5) * 2;
    }
  }, { passive: true });

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
