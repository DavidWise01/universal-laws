<script>// Playables SDK v1.0.0
// Game lifecycle bridge: rAF-based game-ready detection + event communication
(function() {
  'use strict';

  // Idempotency: skip if already initialized (e.g., server-side injection
  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {
      document.addEventListener(events[i], onFirstInteraction, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupFirstInteractionDetection);
  } else {
    setupFirstInteractionDetection();
  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true
    });
  });

  window.addEventListener('unhandledrejection', function(event) {
    if (errorSent) return;
    errorSent = true;
    var reason = event.reason;
    sendEvent('error', {
      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true
    });
  });

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }
  };

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {
    originalRAF.call(window, onFrame);
  }
})();</script>

<style>
body { background: #000; margin: 0; overflow: hidden; font-family: monospace; }

<body>
<div class="info">PRIME DIRECTIVE ÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ BRIDGE.BURNER + NEMISIS = 1 SYSTEM<br>BURN ÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ CHECK ÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ SCALE</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let time = 0;
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  time += 0.02;
  
  // Three stages in triangle
  const radius = 200;
  const stages = [
    { name: 'BURN', color: '#f00', angle: -Math.PI/2, x: 0, y: 0 },
    { name: 'CHECK', color: '#f0f', angle: Math.PI/6, x: 0, y: 0 },
    { name: 'SCALE', color: '#0ff', angle: 5*Math.PI/6, x: 0, y: 0 }
  ];
  
  stages.forEach(s => {
    s.x = centerX + Math.cos(s.angle) * radius;
    s.y = centerY + Math.sin(s.angle) * radius;
  });
  
  // Connect stages (triangle)
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(stages[0].x, stages[0].y);
  ctx.lineTo(stages[1].x, stages[1].y);
  ctx.lineTo(stages[2].x, stages[2].y);
  ctx.closePath();
  ctx.stroke();
  
  // Draw stages
  stages.forEach((s, i) => {
    const pulse = Math.sin(time * 2 + i * 2) * 0.5 + 0.5;
    
    // Outer ring
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 30;
    ctx.shadowColor = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 50 + pulse * 10, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner core
    ctx.fillStyle = s.color;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 20, 0, Math.PI * 2);
    ctx.fill();
    
    // Label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 10;
    ctx.shadowColor = s.color;
    ctx.fillText(s.name, s.x, s.y + 80);
  });
  
  // Center: PRIME
  const centerPulse = Math.sin(time * 3) * 0.5 + 0.5;
  ctx.fillStyle = `rgba(255, 255, 255, ${0.8 + centerPulse * 0.2})`;
  ctx.shadowBlur = 40;
  ctx.shadowColor = '#fff';
  ctx.beginPath();
  ctx.arc(centerX, centerY, 30 + centerPulse * 10, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#000';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('PRIME', centerX, centerY);
  
  // Flow arrows around triangle
  for(let i=0; i<3; i++) {
    const s1 = stages[i];
    const s2 = stages[(i+1)%3];
    const t = (time * 0.5 + i/3) % 1;
    const x = s1.x + (s2.x - s1.x) * t;
    const y = s1.y + (s2.y - s1.y) * t;
    
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Scale effect: particles radiating from SCALE stage
  const scaleStage = stages[2];
  for(let i=0; i<20; i++) {
    const angle = (i / 20) * Math.PI * 2 + time;
    const dist = (time * 30 + i * 10) % 300;
    const x = scaleStage.x + Math.cos(angle) * dist;
    const y = scaleStage.y + Math.sin(angle) * dist;
    const alpha = 1 - dist/300;
    
    ctx.fillStyle = `rgba(0, 255, 255, ${alpha * 0.5})`;
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#0ff';
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Infinite lattice hint (background)
  for(let i=0; i<50; i++) {
    const angle = (i / 50) * Math.PI * 2 + time * 0.1;
    const r = 350 + Math.sin(time + i) * 20;
    const x = centerX + Math.cos(angle) * r;
    const y = centerY + Math.sin(angle) * r;
    
    ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
