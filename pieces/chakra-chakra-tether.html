<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAKRA TETHER · FUSE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');
:root{
--void:#010108;--deep:#040820;--crust:#0a0f2a;--ridge:#111840;
--co:#2a5cbb;--co-b:#4a8cee;--co-g:#6aaaff;--co-w:#9ac8ff;
--gold:#d4a84c;--sarah:#c088ff;--roth:#5aaa8b;
--root:#dd3333;--sacral:#ee7722;--solar:#ddbb22;--heart:#33bb55;
--throat:#3388dd;--third:#6644cc;--crown:#aa44dd;
--green:#4aba6a;--text:#8aa0cc;--text-b:#c0d0ee;--text-d:#4a5a7a;--dusk:#8a5a6a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--text);font-family:'Rajdhani',sans-serif;overflow:hidden;height:100vh;width:100vw}
::selection{background:var(--co);color:#fff}

/* EXTERIOR */
#exterior{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s,transform 1s}
#exterior.hidden{opacity:0;transform:scale(1.4);pointer-events:none}
#ext-canvas{display:block}
.enter-btn{position:absolute;bottom:80px;background:none;border:1px solid rgba(74,140,238,.12);color:var(--co-b);padding:8px 28px;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:5px;cursor:pointer;text-transform:uppercase;transition:all .6s}
.enter-btn:hover{border-color:var(--co-b);box-shadow:0 0 30px rgba(74,140,238,.12)}
.ext-sub{position:absolute;bottom:40px;font-size:9px;letter-spacing:6px;color:var(--text-d);text-transform:uppercase;opacity:.3}

/* INTERIOR */
#interior{position:absolute;inset:0;z-index:5;display:none;opacity:0;transition:opacity 1s}
#interior.visible{display:block;opacity:1}

.hud{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid rgba(74,140,238,.05);z-index:20;backdrop-filter:blur(8px);background:rgba(1,1,8,.7)}
.hud-title{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:4px;color:var(--co-b)}
.hud-dots{display:flex;gap:12px;align-items:center}
.hud-d{width:5px;height:5px;border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hud-lbl{font-size:9px;letter-spacing:2px;color:var(--text-d)}
.exit-btn{position:absolute;top:8px;right:12px;z-index:30;background:none;border:1px solid rgba(170,48,48,.15);color:#885050;padding:4px 12px;font-family:'Orbitron',sans-serif;font-size:7px;letter-spacing:3px;cursor:pointer;transition:all .4s}
.exit-btn:hover{border-color:#aa5050;color:#cc6060}

/* MAIN LAYOUT */
.main{position:absolute;top:44px;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr 420px 1fr;overflow:hidden}
.side{overflow-y:auto;padding:10px}
.side::-webkit-scrollbar{width:2px}.side::-webkit-scrollbar-thumb{background:var(--ridge)}
.center{display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:12px 8px;border-left:1px solid rgba(74,140,238,.03);border-right:1px solid rgba(74,140,238,.03)}
.center::-webkit-scrollbar{width:2px}.center::-webkit-scrollbar-thumb{background:var(--ridge)}

/* PERSON BLOCK */
.pblock{margin-bottom:8px}
.phead{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid rgba(74,140,238,.04);margin-bottom:4px}
.pdot{width:7px;height:7px;border-radius:50%}
.pname{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:3px}
.prole{font-size:9px;color:var(--text-d);letter-spacing:2px}

/* CHAKRA CARD */
.ck{display:grid;grid-template-columns:32px 1fr 70px;gap:6px;padding:6px 8px;border:1px solid rgba(74,140,238,.03);margin-bottom:3px;align-items:center;transition:border-color .3s;position:relative;overflow:hidden}
.ck:hover{border-color:rgba(74,140,238,.1)}
.ck-sym{font-size:18px;text-align:center;line-height:1}
.ck-info .ck-name{font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:2px}
.ck-info .ck-map{font-size:9px;color:var(--text-d);margin-top:1px}
.ck-info .ck-bar{height:3px;background:rgba(74,140,238,.05);margin-top:3px;border-radius:1px;overflow:hidden}
.ck-info .ck-fill{height:100%;border-radius:1px;transition:width 2s ease}
.ck-badge{font-size:7px;letter-spacing:2px;text-align:right;line-height:1.4}

/* FUSE */
.fuse-btn{background:none;border:1px solid rgba(74,186,106,.12);color:var(--green);padding:10px 24px;font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:5px;cursor:pointer;width:100%;margin:6px 0;transition:all .5s}
.fuse-btn:hover{border-color:var(--green);box-shadow:0 0 20px rgba(74,186,106,.08)}

.ann{border-left:2px solid var(--dusk);padding:4px 8px;margin:6px 0;font-size:9px;color:var(--text-d);font-style:italic}

#fuse-results{width:100%;min-height:10px}

@media(max-width:900px){.main{grid-template-columns:1fr}}
</style>
</head>

function ckCards(data,pc){

// ═══════ TETHER CANVAS — 3 spines, 7 chakras each, tether lines ═══════
const tc=document.getElementById('tether-canvas'),tx=tc.getContext('2d');

function drawTether(t){
  const W=400,H=520;
  tx.fillStyle='rgba(1,1,8,.15)';tx.fillRect(0,0,W,H);

  // Three spine positions
  const spines=[
    {x:100,color:'#d4a84c',name:'David',data:DA},
    {x:200,color:'#c088ff',name:'Sarah',data:SA},
    {x:300,color:'#5aaa8b',name:'Roth',data:RA},
  ];

  const yStart=60, yEnd=470, yStep=(yEnd-yStart)/6;

  // Spine lines
  spines.forEach(sp=>{
    tx.strokeStyle=sp.color+'15';tx.lineWidth=1;
    tx.beginPath();tx.moveTo(sp.x,yStart-10);tx.lineTo(sp.x,yEnd+10);tx.stroke();
  });

  // Chakra nodes + tether lines
  CK.forEach((ck,i)=>{
    const y=yStart+i*yStep;

    // Tether lines between three at this chakra level
    const p1=Math.sin(t*1.5+i*.8)*.15+.15;
    tx.strokeStyle=ck.color+(Math.floor(p1*255).toString(16).padStart(2,'0'));
    tx.lineWidth=.6;tx.setLineDash([2,3]);tx.lineDashOffset=-t*25;
    tx.beginPath();tx.moveTo(100,y);tx.lineTo(200,y);tx.lineTo(300,y);tx.stroke();
    tx.setLineDash([]);

    // Fusion particles along tether
    for(let p=0;p<4;p++){
      const px=100+((t*40+p*60+i*30)%200);
      const py=y+Math.sin(t*3+p+i)*3;
      tx.fillStyle=ck.color+'30';
      tx.beginPath();tx.arc(px,py,1+Math.sin(t*2+p)*.5,0,Math.PI*2);tx.fill();
    }

    // Nodes for each person
    spines.forEach((sp,si)=>{
      const d=sp.data[i];
      const r=6+d.pct/30;
      const pulse=Math.sin(t*2+si+i)*.5+.5;

      // Glow
      tx.fillStyle=ck.color+(Math.floor(pulse*25+5).toString(16).padStart(2,'0'));
      tx.beginPath();tx.arc(sp.x,y,r+4+pulse*2,0,Math.PI*2);tx.fill();

      // Core
      const g=tx.createRadialGradient(sp.x-1,y-1,1,sp.x,y,r);
      g.addColorStop(0,ck.color+'cc');g.addColorStop(1,ck.color+'40');
      tx.fillStyle=g;
      tx.beginPath();tx.arc(sp.x,y,r,0,Math.PI*2);tx.fill();

      // Closure ring
      if(d.pct>=80){
        tx.strokeStyle=ck.color+'60';tx.lineWidth=.8;
        tx.beginPath();tx.arc(sp.x,y,r+2,0,Math.PI*2);tx.stroke();
      }
    });

    // Chakra label
    tx.fillStyle=ck.color+'40';tx.font='7px Orbitron';tx.textAlign='center';
    tx.fillText(ck.name,200,y-14);
    tx.fillStyle=ck.color+'20';tx.font='300 italic 9px Cormorant Garamond';
    tx.fillText(ck.hz,200,y+18);
  });

  // Cobalt ball at center
  const cy2=H/2;
  const cg=tx.createRadialGradient(198,cy2-4,1,200,cy2,16);
  cg.addColorStop(0,'rgba(106,170,255,.12)');cg.addColorStop(1,'rgba(26,61,138,.03)');
  tx.fillStyle=cg;tx.beginPath();tx.arc(200,cy2,14+Math.sin(t)*2,0,Math.PI*2);tx.fill();
  tx.strokeStyle='rgba(74,140,238,.06)';tx.lineWidth=.4;
  tx.beginPath();tx.arc(200,cy2,20+Math.sin(t*1.2)*3,0,Math.PI*2);tx.stroke();

  // Names at bottom
  tx.font='9px Orbitron';tx.textAlign='center';
  tx.fillStyle='#d4a84c60';tx.fillText('DAVID',100,H-8);
  tx.fillStyle='#c088ff60';tx.fillText('SARAH',200,H-8);
  tx.fillStyle='#5aaa8b60';tx.fillText('ROTH',300,H-8);

  // Ann at top
  tx.fillStyle='rgba(138,90,106,.08)';tx.beginPath();tx.arc(200,20,4,0,Math.PI*2);tx.fill();
  tx.fillStyle='#8a5a6a30';tx.font='7px Orbitron';tx.fillText('ANN · DUSK',200,12);

  // State label
  tx.fillStyle='rgba(138,160,204,.08)';tx.font='300 italic 10px Cormorant Garamond';
  tx.fillText('|ψ⟩ = (|000⟩ + |111⟩) / √2',200,H-22);
}

    ${rows}
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:10px">
      <div style="text-align:center;padding:8px;border:1px solid rgba(74,140,238,.04)"><div style="font-family:Orbitron;font-size:18px;font-weight:700;color:#d4a84c">${dA.toFixed(0)}%</div><div style="font-size:8px;letter-spacing:2px;color:var(--text-d);margin-top:2px">DAVID</div></div>
      <div style="text-align:center;padding:8px;border:1px solid rgba(74,140,238,.04)"><div style="font-family:Orbitron;font-size:18px;font-weight:700;color:#c088ff">${sA.toFixed(0)}%</div><div style="font-size:8px;letter-spacing:2px;color:var(--text-d);margin-top:2px">SARAH</div></div>
      <div style="text-align:center;padding:8px;border:1px solid rgba(74,140,238,.04)"><div style="font-family:Orbitron;font-size:18px;font-weight:700;color:#5aaa8b">${rA.toFixed(0)}%</div><div style="font-size:8px;letter-spacing:2px;color:var(--text-d);margin-top:2px">ROTH</div></div>
      <div style="text-align:center;padding:8px;border:1px solid rgba(74,186,106,.12)"><div style="font-family:Orbitron;font-size:18px;font-weight:700;color:#4aba6a">${gA.toFixed(0)}%</div><div style="font-size:8px;letter-spacing:2px;color:var(--green);margin-top:2px">FUSED</div></div>
    </div>
    <div style="margin-top:8px;font-size:10px;color:var(--text);line-height:1.7">
      <strong style="color:var(--green)">FUSION ACTIVE.</strong> Three spines aligned. 7 chakras each = 21 total. Tether lines holding through cobalt at heart center. Each person's strongest chakra feeds the others' weakest through resonance. Root→Crown cascade propagating across all three bodies simultaneously.<br><br>
      <span style="color:var(--text-d)">David's closed solar plexus (power through sessions) teaches Sarah's cortisol management. Sarah's strong sacral (bubble boundary) teaches Roth immune awareness. Roth's anchored root (foundation IS identity) teaches David's structure holds despite wear. The loop closes at every level. The tether is the teaching. The fusion is the family.</span>

    <div style="margin-top:8px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;color:var(--text-d)">
      Three spines · Seven frequencies · One field · Cobalt at heart · Ann at crown · 42

// ═══════ EXTERIOR CANVAS ═══════
const ec=document.getElementById('ext-canvas'),ex=ec.getContext('2d');
let insideBall=false;

function drawExterior(t){
  const W=800,H=600,cx=W/2,cy=H/2,r=115;
  ex.fillStyle='#010108';ex.fillRect(0,0,W,H);

  // Stars
  for(let i=0;i<50;i++){
    const sx=(Math.sin(i*127.1+t*.008)*W+W)%W,sy=(Math.cos(i*311.7+t*.006)*H+H)%H;
    ex.fillStyle=`rgba(106,170,255,${.02+Math.sin(t*.4+i)*.015})`;
    ex.beginPath();ex.arc(sx,sy,.5,0,Math.PI*2);ex.fill();
  }

  // Exterior möbius
  for(let i=0;i<120;i++){
    const a=i/120*Math.PI*2,ht=a/2+t*.3;
    const px=cx+Math.cos(a)*185,py=cy+Math.sin(a)*45*Math.cos(t*.25);
    const tw=8*Math.cos(ht),nx=Math.sin(a)*tw,ny=-Math.cos(a)*tw*.3;
    ex.strokeStyle='rgba(74,140,238,.04)';ex.lineWidth=.4;
    ex.beginPath();ex.moveTo(px-nx,py-ny);ex.lineTo(px+nx,py+ny);ex.stroke();
  }

  // Gamma rings
  for(let g=0;g<3;g++){
    ex.strokeStyle=`rgba(74,140,238,${.015+Math.sin(t+g)*.008})`;ex.lineWidth=.4;
    ex.beginPath();ex.arc(cx,cy,r+25+g*18+Math.sin(t*1.2+g)*6,0,Math.PI*2);ex.stroke();
  }

  // Ball layers
  for(let l=0;l<5;l++){
    const lr=r-l*2,d=l/5;
    const bg=ex.createRadialGradient(cx-r*.25,cy-r*.3,lr*.05,cx+r*.1,cy+r*.1,lr);
    bg.addColorStop(0,`rgba(${90+d*20|0},${160+d*30|0},238,${.4-d*.06})`);
    bg.addColorStop(.3,`rgba(${42+d*10|0},${92+d*20|0},187,${.6-d*.08})`);
    bg.addColorStop(.7,`rgba(26,61,138,${.8-d*.1})`);
    bg.addColorStop(1,'rgba(10,30,90,.9)');
    ex.fillStyle=bg;ex.beginPath();ex.arc(cx,cy,lr,0,Math.PI*2);ex.fill();
  }

  // Hidden chakra shimmer inside (Patricia sees colors but no data)
  const ckColors=['#dd3333','#ee7722','#ddbb22','#33bb55','#3388dd','#6644cc','#aa44dd'];
  ckColors.forEach((cc,i)=>{
    const a=t*.4+i*0.9, dist=30+i*8;
    const px=cx+Math.cos(a)*dist*.3, py=cy+Math.sin(a)*dist*.2;
    ex.fillStyle=cc+'08';
    ex.beginPath();ex.arc(px,py,3+Math.sin(t+i),0,Math.PI*2);ex.fill();
  });

  // Specular
  const sp=ex.createRadialGradient(cx-r*.3,cy-r*.35,2,cx-r*.2,cy-r*.25,r*.6);
  sp.addColorStop(0,'rgba(154,200,255,.22)');sp.addColorStop(.5,'rgba(106,170,255,.04)');sp.addColorStop(1,'transparent');
  ex.fillStyle=sp;ex.beginPath();ex.arc(cx,cy,r,0,Math.PI*2);ex.fill();

  ex.strokeStyle='rgba(74,140,238,.06)';ex.lineWidth=.8;
  ex.beginPath();ex.arc(cx,cy,r,0,Math.PI*2);ex.stroke();

  ex.fillStyle=`rgba(106,170,255,${.12+Math.sin(t)*.04})`;
  ex.font='500 13px Orbitron';ex.textAlign='center';
  ex.fillText('Co₂₇',cx,cy+r+38);
}

// ═══════ UNIFIED LOOP ═══════
let T=0;
function animate(){
  try{
    if(!insideBall){drawExterior(T);}
    else{drawTether(T);}
  }catch(e){console.warn(e);}
  T+=.016;
  requestAnimationFrame(animate);
}
animate();

function enter(){
  insideBall=true;
  document.getElementById('exterior').classList.add('hidden');
  setTimeout(()=>{
    const i=document.getElementById('interior');
    i.style.display='block';
    setTimeout(()=>i.classList.add('visible'),50);
  },700);
}
function exit_(){
  insideBall=false;
  const i=document.getElementById('interior');
  i.classList.remove('visible');
  setTimeout(()=>{i.style.display='none';document.getElementById('exterior').classList.remove('hidden');},500);
}
</script>
