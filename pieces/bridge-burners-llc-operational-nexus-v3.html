<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS LIVE WIRE — TOPH Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --cyan:#00f0ff; --purple:#9d4edd; --bg:#030308; }
  * { scrollbar-width: thin; scrollbar-color: #00f0ff33 transparent; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; background:#030308; overflow:hidden; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .glass { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .pane { transition: all 0.3s ease; }
  .pane.active { box-shadow: 0 0 0 1px rgba(0,240,255,0.5), 0 0 30px rgba(0,240,255,0.15) inset; border-color: rgba(0,240,255,0.5) !important; }
  .pane.interference { animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both; border-color:#ff0040 !important; box-shadow:0 0 0 1px #ff0040, 0 0 40px rgba(255,0,64,0.4) !important; }
  @keyframes shake { 10%,90%{transform:translate3d(-1px,0,0)} 20%,80%{transform:translate3d(2px,0,0)} 30%,50%,70%{transform:translate3d(-3px,0,0)} 40%,60%{transform:translate3d(3px,0,0)} }
  input[type=range] { -webkit-appearance:none; appearance:none; height:4px; background:linear-gradient(90deg,#0a1f29,#001318); border-radius:2px; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#00f0ff; border:2px solid #001418; box-shadow:0 0 10px #00f0ff,0 0 20px #00f0ff66; cursor:pointer; transition:0.2s; }
  input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.2); }
  input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#00f0ff; border:2px solid #001418; box-shadow:0 0 10px #00f0ff; cursor:pointer; }
  .wire { stroke:#00f0ff; stroke-opacity:0.15; stroke-width:1.5; fill:none; transition:all 0.3s; }
  .wire.active { stroke-opacity:1; stroke-width:3; filter:url(#glow); animation:wire-pulse 0.8s ease; }
  @keyframes wire-pulse { 0%{stroke-dashoffset:100} 100%{stroke-dashoffset:0} }
  .grid-bg { background-image: linear-gradient(rgba(0,240,255,0.07) 1px,transparent 1px), linear-gradient(90deg,rgba(0,240,255,0.07) 1px,transparent 1px); background-size:32px 32px; }
  .console-text { text-shadow:0 0 5px rgba(0,255,136,0.5); }
  .jane-orb::before { content:''; position:absolute; inset:-20%; background:conic-gradient(from 0deg,#9d4edd,#00f0ff,#9d4edd); border-radius:50%; animation:spin 4s linear infinite; filter:blur(20px); opacity:0.6; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .scanline { position:relative; overflow:hidden; }
  .scanline::after { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,#00f0ff,transparent); animation:scan 3s linear infinite; opacity:0.5; }
  @keyframes scan { 0%{top:-2px} 100%{top:100%} }
</style>
</head>
<body class="bg-[#030308] text-gray-200 h-screen select-none">
<div class="fixed inset-0 grid-bg opacity-[0.03] pointer-events-none"></div>
<div class="fixed inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_top,_rgba(157,78,221,0.12),transparent_60%),radial-gradient(ellipse_at_bottom_right,_rgba(0,240,255,0.1),transparent_50%)]"></div>

<div class="flex h-screen">
  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed lg:relative z-40 w-[280px] h-full bg-black/80 glass border-r border-cyan-900/30 flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-300">
    <div class="h-14 flex items-center gap-3 px-4 border-b border-cyan-900/30">
      <div class="w-8 h-8 rounded bg-gradient-to-br from-cyan-400 to-violet-600 flex items-center justify-center font-bold text-black">N</div>
      <div>
        <div class="font-semibold tracking-wider text-sm">NEXUS LIVE WIRE</div>
        <div class="text-[10px] text-cyan-400/70 -mt-1">TOPH v2.4.1</div>
      </div>
    </div>
    
    <div class="p-3 border-b border-cyan-900/20">
      <div class="text-[11px] uppercase tracking-widest text-gray-500 mb-2">Bridge /mnt/data</div>
      <div id="fileList" class="space-y-1"></div>
    </div>

    <div class="p-3 mt-auto border-t border-cyan-900/20">
      <div class="text-[11px] uppercase tracking-widest text-gray-500 mb-2">Merkle Stream</div>
      <div class="space-y-1.5 mono text-[11px]">
        <div class="flex justify-between"><span class="text-gray-500">Root updates</span><span class="text-cyan-400" id="stat-roots">0</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Throughput</span><span class="text-green-400">4.2 k/s</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Latency</span><span class="text-violet-400">12ms</span></div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col min-w-0 relative">
    <!-- TOPBAR -->
    <header class="h-14 flex items-center justify-between px-3 lg:px-4 border-b border-cyan-900/30 bg-black/40 glass z-30">
      <div class="flex items-center gap-3">
        <button id="menuBtn" class="lg:hidden p-2 hover:bg-white/5 rounded">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="hidden md:flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
          <span class="text-xs mono text-gray-400">LIVE WIRE ACTIVE</span>
        </div>
      <div class="flex items-center gap-2 md:gap-4">
        <button id="linkAll" class="px-3 py-1.5 rounded bg-cyan-950/50 hover:bg-cyan-900/50 border border-cyan-800/50 text-[11px] uppercase tracking-wider transition flex items-center gap-1.5">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span class="hidden sm:inline">Sync Cores</span>
        </button>
        <div class="h-6 w-px bg-cyan-900/30 hidden md:block"></div>
        <div class="flex items-center gap-1.5">
          <div class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></div>
          <span class="text-[11px] mono text-cyan-300">4 CORES</span>
        </div>
      </div>
    </header>

    <!-- WORKSPACE -->
    <div class="flex-1 relative overflow-hidden p-2 lg:p-3 pb-[210px]">
      <div id="workspace" class="relative w-full h-full grid grid-cols-1 lg:grid-cols-2 lg:grid-rows-2 gap-2 lg:gap-3">
        <!-- SVG WIRES -->
        <svg id="merkle-wires" class="hidden lg:block absolute inset-0 w-full h-full pointer-events-none z-10">
          <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
              <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <linearGradient id="wire-g" x1="0" x2="1">
              <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
              <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
              <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.8"/>
            </linearGradient>
          </defs>
        </svg>

        <!-- ROOT0 -->
        <div id="root0" class="hidden lg:block absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none">
          <div class="relative">
            <div class="absolute -inset-6 rounded-full border border-cyan-400/10 animate-ping" style="animation-duration:3s"></div>
            <div class="absolute -inset-3 rounded-full border border-violet-500/20 animate-pulse"></div>
            <div class="w-[110px] h-[110px] rounded-full bg-black/90 glass border border-cyan-400/40 flex items-center justify-center shadow-[0_0_60px_rgba(0,240,255,0.25)]">
              <div class="text-center">
                <div class="text-[10px] tracking-[0.2em] text-cyan-400 font-medium">ROOT0</div>
                <div id="root-hash" class="mono text-[13px] text-white mt-1 tracking-wider">0x7a3f…9c2e</div>
                <div class="flex items-center justify-center gap-1 mt-1.5">
                  <div class="w-1 h-1 rounded-full bg-green-400 animate-pulse"></div>
                  <div id="root-count" class="text-[10px] text-gray-400 mono">0 witnesses</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- PANES -->
        <div id="pane-1" class="pane active group relative bg-black/70 glass border border-cyan-900/40 rounded-lg overflow-hidden flex flex-col hover:border-cyan-700/50 transition-all"></div>
        <div id="pane-2" class="pane group relative bg-black/70 glass border border-cyan-900/40 rounded-lg overflow-hidden flex flex-col hover:border-cyan-700/50 transition-all"></div>
        <div id="pane-3" class="pane group relative bg-black/70 glass border border-cyan-900/40 rounded-lg overflow-hidden flex flex-col hover:border-cyan-700/50 transition-all"></div>
        <div id="pane-4" class="pane group relative bg-black/70 glass border border-cyan-900/40 rounded-lg overflow-hidden flex flex-col hover:border-cyan-700/50 transition-all"></div>
      </div>
    </div>
  </main>
</div>

<!-- JANE CORTEX -->
<div id="jane" class="fixed right-3 lg:right-4 bottom-[188px] w-[calc(100%-1.5rem)] sm:w-[340px] z-30">
  <div class="bg-black/85 glass border border-violet-900/50 rounded-xl shadow-[0_0_40px_rgba(157,78,221,0.2)] overflow-hidden">
    <div class="px-3 py-2.5 border-b border-violet-900/30 flex items-center justify-between bg-gradient-to-r from-violet-950/50 to-transparent">
      <div class="flex items-center gap-2.5">
        <div class="relative w-9 h-9 jane-orb">
          <div class="absolute inset-0 rounded-full bg-violet-600/20 blur-xl"></div>
          <div class="relative w-9 h-9 rounded-full bg-gradient-to-b from-violet-400 to-purple-900 flex items-center justify-center shadow-[0_0_20px_rgba(157,78,221,0.5)]">
            <div class="w-5 h-5 rounded-full bg-black/50 flex items-center justify-center"><div class="w-2 h-2 rounded-full bg-violet-200 animate-pulse"></div></div>
          </div>
        </div>
        <div>
          <div class="text-[12px] font-semibold tracking-wide text-violet-200">JANE CORTEX</div>
          <div class="text-[10px] text-violet-400/70 -mt-0.5">Interference Engine</div>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <div class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></div>
        <span class="text-[10px] mono text-green-400">ONLINE</span>
      </div>
    </div>
    
    <div class="p-3 space-y-2.5">
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-violet-950/30 rounded p-2 border border-violet-900/30">
          <div class="text-[9px] text-violet-300/70 uppercase">Anomaly</div>
          <div id="jane-anomaly" class="text-[15px] font-medium text-violet-200 mono leading-none mt-1">0.12%</div>
        </div>
        <div class="bg-violet-950/30 rounded p-2 border border-violet-900/30">
          <div class="text-[9px] text-violet-300/70 uppercase">Threat</div>
          <div id="jane-threat" class="text-[13px] font-medium text-green-400 leading-none mt-1">LOW</div>
        </div>
        <div class="bg-violet-950/30 rounded p-2 border border-violet-900/30">
          <div class="text-[9px] text-violet-300/70 uppercase">Cores</div>
          <div class="text-[13px] font-medium text-cyan-400 leading-none mt-1 mono">4/4</div>
        </div>
      </div>

      <div class="bg-black/60 rounded border border-violet-900/20 p-2 h-[76px] overflow-hidden">
        <div class="text-[10px] uppercase tracking-wider text-violet-300/60 mb-1.5 flex items-center gap-1.5">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Real-time Detection
        </div>
        <div id="jane-feed" class="space-y-1 mono text-[10px] leading-snug"></div>
      </div>

      <div class="flex gap-1.5">
        <select id="inject-target" class="flex-1 bg-black/70 border border-violet-900/40 rounded px-2 py-1.5 text-[11px] mono text-violet-200 focus:outline-none focus:border-violet-500">
          <option value="1">CHRONOS-1</option>
          <option value="2">CHRONOS-2</option>
          <option value="3">CHRONOS-3</option>
          <option value="4">CHRONOS-4</option>
        </select>
        <button id="inject-btn" class="px-3 py-1.5 bg-violet-600/20 hover:bg-violet-600/30 border border-violet-500/50 rounded text-[11px] uppercase tracking-wider text-violet-200 transition flex items-center gap-1">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          Inject
        </button>
      </div>
    </div>
  </div>
</div>

<!-- CONSOLE -->
<div id="console" class="fixed bottom-0 left-0 lg:left-[280px] right-0 z-40 bg-[#020202]/95 glass border-t border-green-900/50 backdrop-blur-xl transition-all duration-300">
  <div class="flex items-center justify-between px-3 py-1.5 border-b border-green-900/30 bg-green-950/10 cursor-pointer" id="console-toggle">
    <div class="flex items-center gap-2">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
      <span class="text-[11px] uppercase tracking-widest text-green-400 font-medium">Nexus Console</span>
      <span class="text-[10px] mono text-green-600/70">LIVE</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-[10px] mono text-green-700">system@nexus:~</span>
      <svg id="console-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2" class="transition-transform"><path d="M18 15l-6-6-6 6"/></svg>
    </div>
  </div>
  <div id="console-body" class="h-[160px] flex flex-col">
    <div id="console-log" class="flex-1 overflow-y-auto px-3 py-2 mono text-[12px] leading-relaxed console-text text-green-400/90"></div>
    <div class="flex items-center gap-2 px-3 py-2 border-t border-green-900/20 bg-black/50">
      <span class="text-green-500">$</span>
      <input id="cmd-input" class="flex-1 bg-transparent outline-none mono text-[12px] text-green-300 placeholder-green-800" placeholder="type 'help' for commands..." autocomplete="off" spellcheck="false">
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // STATE
  const state = {
    activePane: 1,
    linked: false,
    witnesses: [],
    rootCount: 0,
    panes: {
      1: { playing: true, time: 240, history: [], mode: 'chronos', file: null },
      2: { playing: false, time: 580, history: [], mode: 'chronos', file: null },
      3: { playing: true, time: 710, history: [], mode: 'chronos', file: null },
      4: { playing: false, time: 120, history: [], mode: 'chronos', file: null },
    },
    jane: { anomaly: 0.0012, detections: [] }
  };

  const files = [
    { name:'nexus.db', type:'db', size:'142.4 MB', icon:'database' },
    { name:'genesis.witness', type:'witness', size:'4.2 KB', icon:'key' },
    { name:'dashboard.html', type:'html', size:'24.1 KB', icon:'code' },
    { name:'protocol_v3.html', type:'html', size:'18.7 KB', icon:'code' },
    { name:'witness.log', type:'log', size:'1.1 MB', icon:'file-text' },
    { name:'config.toml', type:'config', size:'2.3 KB', icon:'settings' },
  ];

  // INIT PANES
  const paneTemplate = (id) => `
    <div class="flex items-center justify-between px-3 py-2 border-b border-cyan-900/30 bg-gradient-to-r from-black/80 to-transparent">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full ${state.panes[id].playing ? 'bg-cyan-400 animate-pulse' : 'bg-gray-600'} transition-colors" id="dot-${id}"></div>
        <span class="text-xs font-medium tracking-wider text-cyan-200/90">CHRONOS-${id}</span>
        <span class="text-[10px] px-1.5 py-0.5 rounded bg-cyan-950/50 text-cyan-400/70 border border-cyan-900/50">CORE</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-[10px] mono text-gray-500" id="status-${id}">${state.panes[id].playing ? 'RUNNING' : 'IDLE'}</span>
        <button data-clear="${id}" class="opacity-0 group-hover:opacity-100 transition p-1 hover:bg-white/5 rounded" title="Clear">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-1 0v14a2 2 0 01-2 2H9a2 2 0 01-2-2V6h10z"/></svg>
        </button>
      </div>
    </div>
    <div class="flex-1 relative overflow-hidden scanline">
      <div id="content-${id}" class="absolute inset-0 overflow-auto p-2.5"></div>
      <div id="file-view-${id}" class="absolute inset-0 hidden bg-black/90 p-3"></div>
    </div>
    <div class="h-[52px] flex items-center gap-2.5 px-3 bg-black/70 border-t border-cyan-900/20">
      <button data-play="${id}" class="play-btn w-7 h-7 rounded bg-cyan-950/70 hover:bg-cyan-900/70 border border-cyan-800/50 flex items-center justify-center text-cyan-300 transition">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="flex-1 relative">
        <input type="range" min="0" max="1000" value="${state.panes[id].time}" data-scrub="${id}" class="w-full">
        <div class="absolute -top-4 left-0 right-0 flex justify-between">
          <span class="text-[9px] mono text-gray-600">00:00</span>
          <span class="text-[9px] mono text-gray-600">01:40</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="time-${id}" class="text-[11px] mono w-[42px] text-right text-cyan-200">00:24</span>
        <button data-solo="${id}" class="w-6 h-6 rounded hover:bg-white/5 flex items-center justify-center text-gray-500 hover:text-cyan-400 transition" title="Focus">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M2 12s3-7 10 7 10 7-3 7-10 7-10-7-10-7z"/></svg>
        </button>
      </div>
    </div>
  `;

  [1,2,3,4].forEach(id => {
    document.getElementById(`pane-${id}`).innerHTML = paneTemplate(id);
    document.getElementById(`pane-${id}`).addEventListener('click', () => setActivePane(id));
    // seed history
    for(let i=0;i<4;i++) state.panes[id].history.push({ hash:'0x'+Math.random().toString(16).slice(2,8), t: Math.max(0, state.panes[id].time - i*40) });
  });

  function setActivePane(id){
    state.activePane = id;
    document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
    document.getElementById(`pane-${id}`).classList.add('active');
  }
  setActivePane(1);

  // FILES SIDEBAR
  const fileList = document.getElementById('fileList');
  files.forEach(f=>{
    const icon = f.type==='db' ? '<path d="M12 3v18M4 7h16M4 17h16"/>' : f.type==='html' ? '<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>' : '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>';
    const item = document.createElement('button');
    item.className = 'w-full flex items-center gap-2.5 px-2.5 py-2 rounded hover:bg-cyan-950/40 border border-transparent hover:border-cyan-900/30 transition text-left group';
    item.innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-gray-500 group-hover:text-cyan-400">${icon}</svg>
      <div class="flex-1 min-w-0">
        <div class="text-[12px] truncate text-gray-300 group-hover:text-white">${f.name}</div>
        <div class="text-[10px] text-gray-600">${f.size}</div>
      </div>
    `;
    item.onclick = () => openFile(f);
    fileList.appendChild(item);
  });

  function openFile(file){
    const id = state.activePane;
    const pane = state.panes[id];
    pane.mode = 'file'; pane.file = file;
    const view = document.getElementById(`file-view-${id}`);
    const content = document.getElementById(`content-${id}`);
    content.classList.add('hidden'); view.classList.remove('hidden');
    
    let html = '';
    if(file.type==='html'){
      html = `<div class="h-full flex flex-col"><div class="flex items-center justify-between mb-2 pb-2 border-b border-cyan-900/30"><span class="text-xs mono text-cyan-400">${file.name}</span><button onclick="this.closest('.pane').querySelector('#file-view-${id}').classList.add('hidden');this.closest('.pane').querySelector('#content-${id}').classList.remove('hidden')" class="text-[10px] px-2 py-1 bg-cyan-950/50 rounded hover:bg-cyan-900/50">CLOSE</button></div><div class="flex-1 bg-white/5 rounded border border-cyan-900/20 overflow-auto p-3 mono text-[11px] text-gray-300"> &lt;!DOCTYPE html&gt;<br>&lt;html&gt;<br>&nbsp;&nbsp;&lt;head&gt;&lt;title&gt;${file.name}&lt;/title&gt;&lt;/head&gt;<br>&nbsp;&nbsp;&lt;body&gt;<br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;h1&gt;NEXUS Protocol v3&lt;/h1&gt;<br>&nbsp;&nbsp;&nbsp;&nbsp;&lt;p&gt;Merkle root verified&lt;/p&gt;<br>&nbsp;&nbsp;&lt;/body&gt;<br>&lt;/html&gt;</div></div>`;
    } else if(file.type==='db'){
      html = `<div class="h-full"><div class="flex items-center justify-between mb-2"><span class="text-xs mono text-purple-400">${file.name} — HEX VIEW</span><button class="text-[10px] px-2 py-1 bg-purple-950/50 rounded" onclick="document.getElementById('file-view-${id}').classList.add('hidden');document.getElementById('content-${id}').classList.remove('hidden')">CLOSE</button></div><div class="mono text-[10px] leading-relaxed text-green-300/80 h-[calc(100%-28px)] overflow-auto">${Array.from({length:32},(_,i)=>`<div>${(i*16).toString(16).padStart(8,'0')}  ${Array.from({length:16},()=>Math.floor(Math.random()*256).toString(16).padStart(2,'0')).join(' ')}</div>`).join('')}</div></div>`;
    } else if(file.type==='log' || file.type==='witness'){
      html = `<div class="h-full flex flex-col"><div class="flex items-center justify-between mb-2"><span class="text-xs mono text-amber-400">${file.name}</span><button class="text-[10px] px-2 py-1 bg-amber-950/50 rounded" onclick="document.getElementById('file-view-${id}').classList.add('hidden');document.getElementById('content-${id}').classList.remove('hidden')">CLOSE</button></div><div class="flex-1 overflow-auto mono text-[11px] space-y-0.5">${Array.from({length:20},(_,i)=>`<div class="text-gray-500">[${new Date(Date.now()-i*60000).toISOString().slice(11,19)}] <span class="text-cyan-400">WITNESS</span> 0x${Math.random().toString(16).slice(2,10)}... verified</div>`).join('')}</div></div>`;
    } else {
      html = `<div class="p-4 text-center text-gray-500 mono text-xs">Binary file — ${file.size}</div>`;
    }
    view.innerHTML = html;
    addLog('BRIDGE', `Loaded ${file.name} → CHRONOS-${id}`, 'cyan');
  }

  // WIRES
  function drawWires(){
    const svg = document.getElementById('merkle-wires');
    const workspace = document.getElementById('workspace');
    const root = document.getElementById('root0');
    if(!svg || !root) return;
    const r = root.getBoundingClientRect();
    const w = workspace.getBoundingClientRect();
    const cx = r.left + r.width/2 - w.left;
    const cy = r.top + r.height/2 - w.top;
    svg.querySelectorAll('.wire').forEach(e=>e.remove());
    [1,2,3,4].forEach(id=>{
      const p = document.getElementById(`pane-${id}`).getBoundingClientRect();
      const x = p.left + p.width/2 - w.left;
      const y = p.top + p.height/2 - w.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg','path');
      const dx = cx - x, dy = cy - y;
      const mx = x + dx*0.5, my = y + dy*0.5 - 20;
      line.setAttribute('d', `M${x},${y} Q${mx},${my} ${cx},${cy}`);
      line.setAttribute('class','wire');
      line.setAttribute('id',`wire-${id}`);
      line.setAttribute('stroke-dasharray','4 6');
      svg.appendChild(line);
    });
  }
  setTimeout(drawWires, 100);
  window.addEventListener('resize', drawWires);

  // UPDATE UI
  function fmt(t){ const s=Math.floor(t/10); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
  function updatePane(id){
    const p = state.panes[id];
    document.getElementById(`time-${id}`).textContent = fmt(p.time);
    document.getElementById(`status-${id}`).textContent = p.playing ? 'RUNNING' : 'IDLE';
    document.getElementById(`dot-${id}`).className = `w-2 h-2 rounded-full ${p.playing ? 'bg-cyan-400 animate-pulse' : 'bg-gray-600'} transition-colors`;
    const playBtn = document.querySelector(`[data-play="${id}"]`);
    playBtn.innerHTML = p.playing ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const scrub = document.querySelector(`[data-scrub="${id}"]`);
    if(scrub) scrub.value = p.time;
    
    if(p.mode==='chronos'){
      const el = document.getElementById(`content-${id}`);
      el.innerHTML = p.history.slice(0,12).map((h,i)=>`
        <div class="group/item flex items-center gap-2 py-1 px-1.5 rounded hover:bg-cyan-950/20 border-b border-gray-900/50 last:border-0">
          <div class="w-1 h-6 rounded-full ${i===0?'bg-cyan-400':'bg-gray-700'}"></div>
          <div class="flex-1 min-w-0">
            <div class="mono text-[11px] text-cyan-300 truncate">${h.hash}</div>
            <div class="text-[9px] text-gray-600">witness • t+${fmt(h.t)}</div>
          </div>
          <div class="text-[9px] px-1.5 py-0.5 rounded bg-green-950/40 text-green-400/70 border border-green-900/30">✓</div>
        </div>
      `).join('') || '<div class="h-full flex items-center justify-center text-gray-600 text-xs mono">Awaiting witness generation…</div>';
    }
  }
  [1,2,3,4].forEach(updatePane);

  // CONTROLS
  document.querySelectorAll('[data-play]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); const id=+btn.dataset.play; togglePlay(id); };
  });
  document.querySelectorAll('[data-scrub]').forEach(inp=>{
    inp.oninput = ()=>{ const id=+inp.dataset.scrub; state.panes[id].time=+inp.value; updatePane(id); if(state.linked) syncTimes(id); };
  });
  document.querySelectorAll('[data-clear]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); const id=+btn.dataset.clear; state.panes[id].history=[]; state.panes[id].mode='chronos'; document.getElementById(`file-view-${id}`).classList.add('hidden'); document.getElementById(`content-${id}`).classList.remove('hidden'); updatePane(id); addLog('CHRONOS',`Core ${id} history cleared`,'gray'); };
  });

  function togglePlay(id){
    const p=state.panes[id];
    p.playing=!p.playing;
    if(state.linked){ [1,2,3,4].forEach(i=>state.panes[i].playing=p.playing); [1,2,3,4].forEach(updatePane); }
    else updatePane(id);
    addLog('CHRONOS', `Core ${id} ${p.playing?'▶ RUNNING':'⏸ PAUSED'}`, 'cyan');
  }
  function syncTimes(srcId){
    const t=state.panes[srcId].time;
    [1,2,3,4].forEach(i=>{ if(i!==srcId) state.panes[i].time=t; updatePane(i); });
  }

  document.getElementById('linkAll').onclick = ()=>{
    state.linked=!state.linked;
    const btn=document.getElementById('linkAll');
    btn.classList.toggle('bg-cyan-600/30', state.linked);
    btn.classList.toggle('border-cyan-400/70', state.linked);
    addLog('SYSTEM', state.linked ? 'Chronos cores LINKED' : 'Chronos cores UNLINKED', 'violet');
  };

  // MERKLE PULSE
  function pulseWire(id, hash){
    const wire=document.getElementById(`wire-${id}`);
    if(wire){ wire.classList.add('active'); setTimeout(()=>wire.classList.remove('active'), 900); }
    state.rootCount++;
    state.witnesses.unshift({id, hash, ts:Date.now()});
    if(state.witnesses.length>50) state.witnesses.pop();
    const rootHash='0x'+Math.random().toString(16).slice(2,6)+'…'+Math.random().toString(16).slice(2,6);
    document.getElementById('root-hash').textContent=rootHash;
    document.getElementById('root-count').textContent=`${state.rootCount} witnesses`;
    document.getElementById('stat-roots').textContent=state.rootCount;
    // pane flash
    const pane=document.getElementById(`pane-${id}`);
    pane.style.boxShadow='0 0 0 1px rgba(0,240,255,0.8), 0 0 30px rgba(0,240,255,0.3)';
    setTimeout(()=>pane.style.boxShadow='',400);
    addLog('MERKLE', `Witness ${hash} ← C${id} → ROOT0 ${rootHash}`, 'cyan');
    janeObserve(id, hash);
  }

  // JANE
  const janeFeed=document.getElementById('jane-feed');
  function janeObserve(core, hash){
    const events=[
      `Core-${core} witness validated`,
      `Merkle proof depth=4 verified`,
      `Temporal drift <2ms`,
      `No interference detected`
    ];
    const msg=events[Math.floor(Math.random()*events.length)];
    const el=document.createElement('div');
    el.className='flex gap-1.5';
    el.innerHTML=`<span class="text-violet-600">${new Date().toLocaleTimeString().slice(0,5)}</span><span class="text-gray-400">${msg}</span>`;
    janeFeed.prepend(el);
    while(janeFeed.children.length>4) janeFeed.lastChild.remove();
    // anomaly drift
    state.jane.anomaly = Math.max(0.0005, Math.min(0.008, state.jane.anomaly + (Math.random()-0.48)*0.0004));
    document.getElementById('jane-anomaly').textContent=(state.jane.anomaly*100).toFixed(2)+'%';
    const threat=state.jane.anomaly>0.005?'MED':state.jane.anomaly>0.007?'HIGH':'LOW';
    const threatEl=document.getElementById('jane-threat');
    threatEl.textContent=threat;
    threatEl.className=`text-[13px] font-medium leading-none mt-1 ${threat==='LOW'?'text-green-400':threat==='MED'?'text-amber-400':'text-red-400'}`;
  }
  // seed jane
  for(let i=0;i<3;i++) janeObserve(1,'seed');

  document.getElementById('inject-btn').onclick=()=>{
    const target=+document.getElementById('inject-target').value;
    const pane=document.getElementById(`pane-${target}`);
    pane.classList.add('interference');
    setTimeout(()=>pane.classList.remove('interference'),1200);
    state.jane.anomaly=Math.min(0.02, state.jane.anomaly+0.006);
    addLog('JANE', `⚠ Interference injected → CHRONOS-${target}`, 'violet');
    addLog('CHRONOS', `Core ${target} anomaly spike detected`, 'amber');
    const el=document.createElement('div');
    el.className='flex gap-1.5 text-amber-400';
    el.innerHTML=`<span>${new Date().toLocaleTimeString().slice(0,5)}</span><span>INTERFERENCE pattern injected → C${target}</span>`;
    janeFeed.prepend(el);
    // corrupt history
    state.panes[target].history.unshift({hash:'0xBAD…'+Math.random().toString(16).slice(2,4), t:state.panes[target].time});
    updatePane(target);
  };

  // CONSOLE
  const clog=document.getElementById('console-log');
  const cmdIn=document.getElementById('cmd-input');
  function addLog(sys,msg,color='green'){
    const colors={green:'text-green-400/90',cyan:'text-cyan-400/90',violet:'text-violet-400/90',amber:'text-amber-400/90',gray:'text-gray-500',red:'text-red-400/90'};
    const time=new Date().toLocaleTimeString('en-GB',{hour12:false});
    const line=document.createElement('div');
    line.innerHTML=`<span class="text-green-800">[${time}]</span> <span class="${sys==='JANE'?'text-violet-400':sys==='MERKLE'?'text-cyan-400':'text-green-600'}">${sys}</span> <span class="${colors[color]||colors.green}">${msg}</span>`;
    clog.appendChild(line);
    clog.scrollTop=clog.scrollHeight;
  }
  // boot logs
  ['NEXUS LIVE WIRE initializing...','Loading 4x Chronos cores','Merkle wire mesh online','ROOT0 anchored','JANE CORTEX interference engine active','Bridge /mnt/data mounted (6 files)','System ready.'].forEach((m,i)=>setTimeout(()=>addLog('SYS',m),i*180));

  const commands={
    help:()=>'Available: status, merkle, chronos, jane, ls, cat <file>, clear, sync',
    status:()=>`NEXUS LIVE WIRE v2.4.1\n• Cores: ${Object.values(state.panes).filter(p=>p.playing).length}/4 active\n• Linked: ${state.linked?'YES':'NO'}\n• Witnesses: ${state.rootCount}\n• Root: ${document.getElementById('root-hash').textContent}\n• Jane anomaly: ${(state.jane.anomaly*100).toFixed(2)}%`,
    merkle:()=>`ROOT0: ${document.getElementById('root-hash').textContent}\nRecent witnesses:\n${state.witnesses.slice(0,5).map(w=>` • C${w.id} ${w.hash} @${new Date(w.ts).toLocaleTimeString()}`).join('\n')||' none'}`,
    chronos:()=>[1,2,3,4].map(i=>`C${i}: ${state.panes[i].playing?'RUN':'IDLE'} t=${fmt(state.panes[i].time)} hist=${state.panes[i].history.length}`).join('\n'),
    jane:()=>`JANE CORTEX\n• Anomaly: ${(state.jane.anomaly*100).toFixed(3)}%\n• Threat: ${document.getElementById('jane-threat').textContent}\n• Monitoring: 4 cores + merkle stream\n• Status: LEARNING`,
    ls:()=>' /mnt/data\n'+files.map(f=>`${f.name.padEnd(20)} ${f.size}`).join('\n'),
    clear:()=>{clog.innerHTML='';return 'Console cleared';},
    sync:()=>{state.linked=!state.linked; document.getElementById('linkAll').click(); return `Sync ${state.linked?'enabled':'disabled'}`;},
  };
  function runCmd(cmd){
    addLog('USER',`> ${cmd}`,'gray');
    const [base,...args]=cmd.trim().split(/\s+/);
    if(base==='cat' && args[0]){
      const f=files.find(x=>x.name===args[0]);
      if(!f) return addLog('FS','File not found','red');
      if(f.type==='db') return addLog('FS',`${f.name}: binary data (${f.size}) - use hex viewer`,'amber');
      return addLog('FS',`--- ${f.name} ---\n${f.type==='witness'?'{\n  "root":"0x7a3f...","witnesses":247\n}':f.type==='log'?'[INFO] Merkle root anchored\n[INFO] 247 witnesses verified':'<html> ... </html>'}`, 'cyan');
    }
    const fn=commands[base];
    if(fn){ const out=fn(); out.split('\n').forEach(l=>addLog('SYS',l,'green')); }
    else if(cmd) addLog('SYS',`Unknown command: ${base}. Type 'help'`, 'red');
  }
  cmdIn.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const v=cmdIn.value.trim(); if(v){ runCmd(v); cmdIn.value=''; } } });

  document.getElementById('console-toggle').onclick=()=>{
    const body=document.getElementById('console-body');
    const chev=document.getElementById('console-chev');
    const isOpen=body.style.display!=='none';
    body.style.display=isOpen?'none':'flex';
    chev.style.transform=isOpen?'rotate(180deg)':'rotate(0)';
    document.getElementById('jane').style.bottom=isOpen?'20px':'188px';
  };

  // MAIN LOOP
  setInterval(()=>{
    [1,2,3,4].forEach(id=>{
      const p=state.panes[id];
      if(p.playing){
        p.time=(p.time+2)%1001;
        if(state.linked && id===1) [2,3,4].forEach(j=>state.panes[j].time=p.time);
        updatePane(id);
        // random witness
        if(Math.random()<0.035){
          const hash='0x'+Math.random().toString(16).slice(2,10);
          p.history.unshift({hash,t:p.time});
          if(p.history.length>20) p.history.pop();
          updatePane(id);
          pulseWire(id,hash);
        }
      }
    });
  },120);

  // ambient logs
  setInterval(()=>{
    if(Math.random()<0.3){
      const cores=[1,2,3,4].filter(i=>state.panes[i].playing);
      if(cores.length) addLog('CHRONOS',`Core ${cores[Math.floor(Math.random()*cores.length)]} checkpoint`, 'gray');
    }
  },4000);

  // mobile sidebar
  document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('-translate-x-full');

  // initial update
  drawWires();
  setTimeout(()=>{ addLog('MERKLE','Wire mesh calibrated — 4 paths active','cyan'); },800);
});
</script>
</body>
</html>
